# Arguments passed to every yaycache invocation. Settings ending in _args may
# be an array or a string; a string is split like the shell would, honouring
# quotes, e.g. "--min-mtime '30 days ago' --remove-build-files".
extra_args=(-v)

# yay cache directories to clean. The hook runs as root, so this cannot be
# left to yaycache's default (~/.cache/yay of the *root* user). Globs are
# expanded. Empty means every user's cache: /home/*/.cache/yay/*/
cache_dirs=()

installed=true
installed_keep=2
installed_extra_args=()
installed_move_to=

uninstalled=true
uninstalled_keep=1
uninstalled_extra_args=()
uninstalled_move_to=
