<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed by ttf-commissioner-hinted (variable build). NOT enabled by
     default. Enable with:

       sudo ln -s /usr/share/fontconfig/conf.avail/79-commissioner-families.conf \
                  /etc/fonts/conf.d/

     Commissioner's three "voices" are axis settings, not separate files (the
     designer's own statics call them Commissioner, CommissionerFlare and
     CommissionerLoud). A variable font only exposes its named instances to
     fontconfig, and none of those set FLAR or VOLM, so without this file the
     voices are reachable only as "@FLAR=100" in a font description. These
     rules give them names:

       "Commissioner Flare Bold Italic 11" == "Commissioner Bold Italic 11 @FLAR=100"
       "Commissioner Loud 11"              == "Commissioner 11 @FLAR=100,VOLM=100"

     Verified against the designer's own static TTFs from the 1.012 release:
     Flare is FLAR 100 with VOLM 0, Loud is FLAR 100 with VOLM 100 (rendered
     and compared at 200 px; the wrong voice is 10-20x further away). VOLM on
     its own does essentially nothing - it reshapes the flared serifs instead
     of adding its own, and every extent at FLAR 0 + VOLM 100 is identical to
     FLAR 0 - so there is no "volume" family here.

     Weight, italic and size combine as usual: pango sends its own wght (from
     the weight) and picks the italic file (from the style) and merges these
     values on top. They do not appear in font pickers, which only list real
     faces; the real "Commissioner Flare"/"Commissioner Loud" families exist
     only in a static build (STATIC_VOICES="default flare loud").

     Only pango (GTK, GNOME Shell, most Linux desktop apps) reads
     fontvariations from fontconfig. Firefox and Chromium ignore it; use CSS
     there:

       font-variation-settings: "FLAR" 100, "VOLM" 100;

     The flare axis adds a swelling to the stem terminals (+0.5% line width,
     ascenders 3/2000 em longer, x-height and cap height unchanged); the volume
     axis turns those swelling serifs into wedge shapes and changes, in the
     whole test string, one advance width by 5 units. -->
<fontconfig>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Commissioner Flare</string></test>
    <edit name="family" mode="assign" binding="same"><string>Commissioner</string></edit>
    <edit name="fontvariations" mode="append"><string>FLAR=100</string></edit>
  </match>
  <!-- Both axes in ONE string: pango reads the first element of the
       fontvariations list and ignores the rest, so two <edit>s here would
       silently apply only FLAR (verified with pango 1.58). -->
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Commissioner Loud</string></test>
    <edit name="family" mode="assign" binding="same"><string>Commissioner</string></edit>
    <edit name="fontvariations" mode="append"><string>FLAR=100,VOLM=100</string></edit>
  </match>
  <!-- A half flare, for text that should look slightly serifed without
       becoming a display face. Not one of the designer's voices. -->
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Commissioner Semi Flare</string></test>
    <edit name="family" mode="assign" binding="same"><string>Commissioner</string></edit>
    <edit name="fontvariations" mode="append"><string>FLAR=50</string></edit>
  </match>
</fontconfig>
