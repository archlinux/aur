[eclipse-installer]
source = "htmlparser"
url = "https://download.eclipse.org/oomph/epp/installer-index.xml"
is_xml = true
xpath = "//index/installer[@os='linux']/@release"

# Replace 2025-12/R with 2025.12
from_pattern = "(\\d+)-(\\d+)/R"
to_pattern = "\\1.\\2"

# Only include release versions (/R)
include_regex = "^\\d+-\\d+/R$"
