# Releases of the same major version from nuget.org, see the PKGBUILD for why newer ones aren't packaged here
[dotnet-jsonschema-net-7]
source = "jq"
url = "https://api.nuget.org/v3-flatcontainer/jsonschema.net/index.json"
filter = '.versions | map(select(startswith("7.") and (contains("-") | not))) | last'
