# Listed stable versions from the NuGet search API: the flat container index includes unlisted ones
# The latest PowerShell Standard 5 release on nuget.org (upstream doesn't tag), the repository's
# master is at 7.0.0-preview.1
[dotnet-powershellstandard-library]
source = "jq"
url = "https://azuresearch-usnc.nuget.org/query?q=packageid:powershellstandard.library&prerelease=false&semVerLevel=2.0.0"
filter = '.data[0].versions | map(.version) | map(select(startswith("5."))) | last'
