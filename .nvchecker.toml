[waydroidsu-bin]
source = "jq"
url = "https://api.github.com/repos/mistrmochov/WaydroidSU/releases/latest"
filter = ".assets[] | select(.name | test(\".pkg.tar.zst$\")) | .name | capture(\"wsu-(?<ver>.*?)-x86_64-\") | .ver"
from_pattern = '-'
to_pattern = '_'

