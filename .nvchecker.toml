[godot-dev-bin]
source = "jq"
url = "https://api.github.com/repos/godotengine/godot-builds/contents/releases"
filter = '.[] | .name | capture("godot-(?<v>.*)\\.json") | .v | gsub("dev"; "alpha") | gsub("-stable"; "") | gsub("-"; "") | . + "+commit"'

