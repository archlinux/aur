[opengrep]
source = "git"
git = "https://github.com/opengrep/opengrep.git"
include_regex = "v\\d+\\.\\d+\\.\\d+"
prefix = "v"
sort_version_key = "vercmp"

["opengrep:_memprof_limits_commit"]
source = "git"
git = "https://gitlab.com/dimitris-m/memprof-limits.git"
use_commit = true

