# The tags of SourceMod's development builds, from master (1.13 and later): each build is tagged,
# <version>.<build>, and released as a prerelease
[sourcemod-dev]
source = "git"
git = "https://github.com/alliedmodders/sourcemod.git"
use_max_tag = true
include_regex = '1\.(1[3-9]|[2-9]\d)\.\d+\.\d+'
