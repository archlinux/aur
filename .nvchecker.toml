["dotnet-core-rc-bin"]
source = "jq"
url = "https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json"
filter = '.["releases-index"][] | "\(.["latest-runtime"] | split("-")[0]).sdk\(.["latest-sdk"] | sub("^[0-9]+\\.[0-9]+\\."; ""))"'
exclude_regex = '.*preview.*'
from_pattern = '-([A-Za-z]+)\.'
to_pattern = '\1'
