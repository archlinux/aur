# Listed stable versions from the NuGet search API: the flat container index includes unlisted ones
# Releases of the same major version from nuget.org, see the PKGBUILD for why newer ones aren't packaged here
[dotnet-json-more-net-2]
source = "jq"
url = "https://azuresearch-usnc.nuget.org/query?q=packageid:json.more.net&prerelease=false&semVerLevel=2.0.0"
filter = '.data[0].versions | map(.version) | map(select(startswith("2."))) | last'
