## Today's way
[discord-electron-openasar]
source = "cmd"
cmd = """\
LANG=C pacman -Si discord | grep Version | sed -E 's,.*:([0-9.]+)-.*,\\1,' | tr '\\n' '+' && \
rm -rf openasar && \
git clone --quiet https://github.com/goosemod/openasar && \
git -C openasar rev-list --count HEAD && \
rm -rf openasar
"""
