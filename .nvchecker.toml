# Releases of the same major version from nuget.org, see the PKGBUILD for why newer ones aren't packaged here
[dotnet-jsonpointer-net-5]
source = "jq"
url = "https://api.nuget.org/v3-flatcontainer/jsonpointer.net/index.json"
filter = '.versions | map(select(startswith("5.") and (contains("-") | not))) | last'
