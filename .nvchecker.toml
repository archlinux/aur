# The latest commit, versioned like git describe from the last tag (see the PKGBUILD): the compare
# API counts the commits since the tag and lists up to 250 of them, the last one being the newest.
# A new tag needs the tag in the URL updated.
[ambuild]
source = "jq"
url = "https://api.github.com/repos/alliedmodders/ambuild/compare/2.2...master"
filter = '"2.2.r\(.ahead_by).g\(.commits[-1].sha[0:7])"'
