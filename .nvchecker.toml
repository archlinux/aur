[mdsh]
source = "combiner"
from = ["mdsh:release", "mdsh:commit"]
format = "$1.$2"

["mdsh:release"]
source = "github"
github = "zimbatm/mdsh"
use_max_tag = true
prefix = "v"

["mdsh:commit"]
source = "jq"
url = "https://api.github.com/repos/zimbatm/mdsh/compare/v0.9.2...main"
filter = '"r\(.ahead_by).g\(.commits | last | .sha[:7])"'
