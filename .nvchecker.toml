[obs-rust]
source = "git"
git = "https://github.com/obs-rust/obs-studio.git"
# Allowing snapshot tags until stable tags are a regular thing
# prefix = 'obs-studio-rust-v'
# include_regex = 'obs-studio-rust-v\d+\.\d+\.\d+'
include_regex = 'obs-studio-rust-v.*'
from_pattern = 'obs-studio-rust-v(\d+\.\d+\.\d+)-(beta.\d+)'
to_pattern = '\1\2'
