# Deliberately tracks libarchive's own upstream releases directly, not
# Arch's official core/libarchive package -- this package's pkgver can
# (and as of 2026-10-15, at 3.8.10, does) legitimately run ahead of
# Arch's own repackage cadence (3.8.9-1 as of the same date). Expected,
# not a bug; will self-resolve once Arch repackages.
[libarchive]
source = "git"
git = "https://github.com/libarchive/libarchive.git"
prefix = "v"
