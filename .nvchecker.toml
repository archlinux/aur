[matlab]
source = "regex"
url = "https://raw.githubusercontent.com/mathworks-ref-arch/container-images/refs/heads/main/matlab-deps/README.md"
regex = "r20\\d{2}[ab]"
from_pattern = "r20(\\d{2}[ab])"
to_pattern = "R20\\1+autoupdated"

