# Configuration du service Tune — lu par systemd au démarrage
# (/etc/default/tune-server). Ce fichier est un « conffile » dpkg : vos
# modifications survivent aux mises à jour du paquet.
#
# Syntaxe : une variable par ligne, VALEUR sans guillemets, pas de commande
# shell — systemd lit ce fichier lui-même, ce n'est pas un script.
#
# Après toute modification :
#     sudo systemctl restart tune-server
#
# La liste complète des variables TUNE_* est dans README.md et dans
# /usr/share/doc/tune-server/README.Debian.

# Port du client web (http://<ip-du-serveur>:8888)
TUNE_PORT=8888

# Dossiers de musique : liste séparée par des virgules, ou tableau JSON.
# Le service tourne sous l'utilisateur système « tune » : il doit pouvoir LIRE
# ces dossiers (et y ÉCRIRE si vous utilisez l'import de fichiers).
#TUNE_MUSIC_DIRS=/srv/musique,/mnt/nas/flac

# Scanner la bibliothèque au démarrage
#TUNE_AUTO_SCAN=true

# Niveau de journal : error, warn, info, debug, trace
#TUNE_LOG_LEVEL=info
