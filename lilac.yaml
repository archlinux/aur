build_prefix: extra-x86_64

maintainers:
  - github: lucaszhou007
    email: lucaszhou007@gmail.com

update_on:
  - source: regex
    url: https://github.com/PrismML-Eng/llama.cpp/releases.atom
    # captures the full tag suffix "bNNNNN-<sha7>" so pkgver and _commit
    # always move as one atomic pair (same b-number can ship a new sha)
    regex: '<title>prism-(b\d+-[0-9a-f]{7})'

pre_build_script: |
  if getattr(_G, 'newver', None):
      ver, _, commit = _G.newver.rpartition('-')
      for line in edit_file('PKGBUILD'):
          if line.startswith('_commit='):
              line = f'_commit={commit}'
          print(line)
      update_pkgver_and_pkgrel(ver)
  else:
      # forced rebuild (lilac <pkg> without a new upstream version)
      update_pkgrel()

post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
