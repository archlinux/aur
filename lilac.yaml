build_prefix: extra-x86_64

maintainers:
  - github: lucaszhou007
    email: lucaszhou007@gmail.com

# Same upstream as garage-webui (khairul169/garage-webui); tags have no "v"
# prefix, capture from the releases.atom link href.
update_on:
  - source: regex
    url: https://github.com/khairul169/garage-webui/releases.atom
    regex: 'releases/tag/(\d+\.\d+\.\d+)'

pre_build_script: |
  if getattr(_G, 'newver', None):
      update_pkgver_and_pkgrel(_G.newver)
  else:
      # forced rebuild (lilac <pkg> without a new upstream version)
      update_pkgrel()

post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
