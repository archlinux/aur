build_prefix: extra-x86_64

maintainers:
  - github: lucaszhou007
    email: lucaszhou007@gmail.com

# Same source page as hbuilderx-bin; match only the "-alpha" download URL.
update_on:
  - source: regex
    url: https://raw.githubusercontent.com/dcloudio/hbuilderx-extension-docs/master/en/Tutorial/install/linux-cli.md
    regex: 'HBuilderX\.([0-9]+\.[0-9]+\.[0-9]{10})-alpha'

pre_build_script: |
  if getattr(_G, 'newver', None):
      update_pkgver_and_pkgrel(_G.newver)
  else:
      # forced rebuild (lilac <pkg> without a new upstream version)
      update_pkgrel()

post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
