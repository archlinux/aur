build_prefix: extra-x86_64

maintainers:
  - github: lucaszhou007
    email: lucaszhou007@gmail.com

# DCloud's download pages are JS-rendered; the docsify source markdown on
# GitHub (https://hx.dcloud.net.cn/Tutorial/install/linux-cli reads it) is
# updated with every release and carries both stable and alpha download links.
# The "-alpha" in the alpha URL keeps this regex from matching it.
update_on:
  - source: regex
    url: https://raw.githubusercontent.com/dcloudio/hbuilderx-extension-docs/master/en/Tutorial/install/linux-cli.md
    regex: 'HBuilderX\.([0-9]+\.[0-9]+\.[0-9]{10})\.linux_x64'

pre_build_script: |
  if getattr(_G, 'newver', None):
      update_pkgver_and_pkgrel(_G.newver)
  else:
      # forced rebuild (lilac <pkg> without a new upstream version)
      update_pkgrel()

post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
