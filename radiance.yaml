# Optional model keys worth knowing (radiance --help lists every one):
#   prefill-interleave: N   decode-only steps scheduled between prefill chunks. The
#                           2.0.0 default auto:1 sizes them from measured step times
#                           (a decode that used to wait behind a 64K prompt runs
#                           12.3 -> 40.9 tok/s; GUIDE.md 4.x). 0 restores the old
#                           schedule; N pins the share.
#   prefix-cache-mib: N     keeps finished conversations in RAM, UNENCRYPTED
#   prefix-cache-ttl: S     how long a prefix entry stays (GUIDE.md 4.8)
#   deterministic: true     reproducible scheduling (disables the lending cache)
#   debug-graph: true       prints op->kernel resolution and exits (diagnostic,
#                           not for serving)
