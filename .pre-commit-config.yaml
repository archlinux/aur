repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://gitlab.com/damien.flament/pre-commit-archlinux-package
    rev: 1.0.0
    hooks:
      - id: check-srcinfo
