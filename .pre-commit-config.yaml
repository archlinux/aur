---
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, pre-push, manual]
exclude: "(?x)^(\n    .*cache.*/.*|  # Exclude cache directories\n    .*venv.*/.*|\
  \  # Exclude virtual environment directories\n)$\n"
fail_fast: true
repos:
  - hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-vcs-permalinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
  - hooks:
      - id: gitleaks
    repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
  - hooks:
      - id: yamllint
    repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
  - hooks:
      - id: yamlfix
    repo: https://github.com/lyz-code/yamlfix
    rev: 1.17.0
  - hooks:
      - id: srcinfo-fixer
      - id: verify-srcinfo-checksums
    repo: https://github.com/edlanglois/pkgbuild-hooks
    rev: v0.2.0
