soulseek:
  username: 
  password: 
  description: slskd user

directories:
  downloads: /var/lib/slskd/downloads
  incomplete: /var/lib/slskd/incomplete

web:
  port: 5030
  https:
    disabled: true
  # Uncomment to set authentication
  # authentication:
