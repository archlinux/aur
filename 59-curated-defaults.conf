<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Independent curated defaults for generic font families</description>

  <!-- Weak preferences retain explicit family requests and fallback lists. -->
  <alias binding="weak">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="weak">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="weak">
    <family>ui-sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <prefer><family>Cascadia Mono</family></prefer>
  </alias>
  <alias binding="weak">
    <family>ui-monospace</family>
    <prefer><family>Cascadia Mono</family></prefer>
  </alias>
</fontconfig>
