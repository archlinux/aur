<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prefer Noto for generic families, so it wins against FreeSans, etc. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif Devanagari</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Devanagari</family>
    </prefer>
  </alias>

</fontconfig>
