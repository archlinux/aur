# Nginx configuration for Wavelog
# Copy this file to /etc/nginx/sites-available/ and create a symlink to sites-enabled/
# Or include it in your main nginx.conf
#
# IMPORTANT NOTES:
# 1. HTTPS strongly recommended: Required for 'KEEP LOGIN' 30-day feature
# 2. For pretty URLs: Set $config['index_page'] = '' in /var/lib/wavelog/config/config.php
# 3. Arch Linux uses /run/php-fpm/php-fpm.sock for PHP-FPM socket

# HTTP server (Port 80) - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wavelog.example.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server (Port 443) - RECOMMENDED CONFIGURATION
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wavelog.example.com;

    # SSL Configuration
    # Replace with your actual certificate paths
    ssl_certificate /etc/ssl/certs/wavelog.crt;
    ssl_certificate_key /etc/ssl/private/wavelog.key;
    
    # SSL Security Settings (recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /usr/share/webapps/wavelog;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/wavelog_access.log;
    error_log /var/log/nginx/wavelog_error.log;

    # Enable gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Restrict access to sensitive directories
    location ~ ^/(application|system) {
        deny all;
        return 404;
    }

    # Deny access to hidden files (including .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Allow access to assets
    location /assets {
        try_files $uri $uri/ =404;
    }

    # CodeIgniter URL rewriting
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $host;
        
        # Security settings
        fastcgi_param PHP_VALUE "open_basedir=/tmp:/usr/share/webapps/wavelog:/var/lib/wavelog:/var/log/wavelog:/var/cache/wavelog";
        fastcgi_param PHP_VALUE "upload_tmp_dir=/tmp";
        fastcgi_param PHP_VALUE "session.save_path=/tmp";
    }
}

