# Detect new cursor-agent CLI releases.
# Run: nvchecker -c nvchecker.toml
# After a bump is detected, run ./update-pkgver.sh to apply it.
[cursor-cli]
source = "regex"
url = "https://cursor.com/install"
regex = 'downloads\.cursor\.com/lab/(\d{4}\.\d{2}\.\d{2}-[A-Za-z0-9]+)'

[__config__]
oldver = "oldver.json"
newver = "newver.json"
