# For more details on the config options see https://github.com/crosspoint-reader/crosspoint-sync#configuration
# All options that are left at default values are commented out

# SQLite file (parent dirs auto-created) can not be outside
# /var/lib/crosspoint-sync because of systemd sandboxing, if you want to move
# it elsewhere modify the systemd service config accordingly
DATABASE_PATH=/var/lib/crosspoint-sync/crosspoint.db

# Listen port
#PORT=8080

# Set true to lock down a private instance
#REGISTRATION_DISABLED=false

# Per-IP limit on registration (0 disables)
#AUTH_RATE_LIMIT_PER_MINUTE=30

# Enables external-service connectors. 64 hex chars, a base64 32-byte key, or a
# ≥32-char passphrase. Encrypts stored connector credentials at rest; unset =
# connectors disabled.
#TOKEN_ENC_KEY=

# Set true only when direct access is blocked and a trusted reverse proxy
# overwrites any client-supplied X-Forwarded-Proto; permits connector linking
# through an HTTPS-terminating proxy. Defaults to true when RAILWAY_ENVIRONMENT
# is present, since Railway always fronts the service with its TLS-terminating
# edge; set TRUST_PROXY=false to override.
#TRUST_PROXY

# Origins allowed to call the sync API from browsers (comma-separated). The
# default wildcard is safe: the API authenticates with headers, not cookies,
# and the web UI's cookie routes never get CORS headers.
#CORS_ORIGINS=*
