# Disable Hyprland backdrop blur for the Perssua overlay, so apps visible
# through its transparent regions stay sharp instead of being frosted-glass blurred.
#
# To enable: source this file from your hyprland.conf, e.g.:
#   source = /usr/share/perssua/hyprland-perssua.conf
windowrule = no_blur on, match:class ^(perssua)$
