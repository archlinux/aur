# Toonflow 服务配置
# 格式为 systemd EnvironmentFile：每行一个 KEY=VALUE，不要加引号、不要写 export。
# 修改后执行：sudo systemctl restart toonflow

# 监听端口（1–65535）
TOONFLOW_SERVER_PORT=3006

# 数据目录。
# 默认 /var/lib/toonflow，由单元中的 StateDirectory= 创建并归属 toonflow 账户。
# 若改到其它路径，需要同时放开写权限，例如：
#   sudo systemctl edit toonflow
#   [Service]
#   ReadWritePaths=/srv/toonflow
TOONFLOW_DATA_DIR=/var/lib/toonflow

# 其它可选环境变量（不设置时由 /usr/bin/toonflow 提供默认值）
#NODE_ENV=production
