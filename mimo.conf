# speech-dispatcher output module for Xiaomi MiMo TTS
# Uses a native Python module (sd_mimo.py) instead of sd_generic,
# to properly handle UTF-8 multi-byte characters (Chinese, etc.)

Debug 0

# Sound icons (optional)
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Voice mapping
AddVoice "zh" "MALE1"    "mimo_default"
AddVoice "zh" "FEMALE1"  "mimo_default"
AddVoice "en" "MALE1"    "default_en"
AddVoice "en" "FEMALE1"  "default_en"

DefaultVoice "mimo_default"
