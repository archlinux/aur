source: github_release
repo: M0n7y5/pipeasio
prefix: v
allow_prerelease: true
verify_commands:
  - command -v pipeasio-register
  - command -v pipeasio-settings
  - pipeasio-manage --version
  - test -f /usr/share/pipeasio/manager/pipeasio-check.exe
  - test -f /usr/lib/wine/x86_64-windows/pipeasio64.dll
  - test -f /usr/lib/wine/x86_64-unix/pipeasio64.so
  - test -f /usr/lib/wine/i386-windows/pipeasio32.dll
  - test -f /usr/share/applications/pipeasio-settings.desktop
  - test -f /usr/share/icons/hicolor/scalable/apps/pipeasio.svg
