# The process settings of the SOGo 6 API server and its agent (Celery), KEY=value per line. The
# services load this file as their environment (EnvironmentFile=), which takes precedence over
# /etc/sogo/process.conf, the file SOGo reads itself. All settings and their defaults:
# /usr/share/sogo6-server/app/config/settings/ProcessSetting.py and
# https://www.sogo.nu/files/docs/v6/SOGo6-AdminDoc/alpha/2_1_process_settings.html
#
# sogo6.service doesn't start until the secrets and the admin password below are set.

# --- Secrets ---
# The key that signs the vouchers (JWT) of the users, exactly 32 characters: openssl rand -hex 16
SOGO_P_VOUCHER_SECRET=
# The AES-256 key that encrypts the stored credentials, 32 bytes in base64: openssl rand -base64 32
SOGO_AES_ENC_KEY=
# Flask's secret key: openssl rand -hex 32
SECRET_KEY=

# --- Admin API ---
# The administrator of the admin API, which configures SOGo. Upstream's default is admin/admin.
SOGO_P_ADMIN=admin
SOGO_P_ADMIN_PWD=

# --- Redis (cache, and the broker of the agent) ---
# Valkey or Redis; Valkey listens on localhost:6379 by default
SOGO_P_REDIS_URL=redis://localhost:6379/0
# SOGO_P_REDIS_RESP_3=true

# --- Database ---
# PostgreSQL or MySQL; the user needs the rights to create the tables
# SOGO_P_DB_TYPE=PostgreSQL
# SOGO_P_DB_NAME=sogo
# SOGO_P_DB_USER=sogo
# SOGO_P_DB_PASS=
# SOGO_P_DB_HOST=localhost
# SOGO_P_DB_PORT=5432
# SOGO_P_DB_SSL=false
# SOGO_P_DB_ENC=utf8

# --- First start ---
# With an empty database, SOGo only offers the admin API until the system settings and the default
# domain are configured. Alternatively, these JSON files configure them on the first start, see the
# examples in /usr/share/doc/sogo6-server/examples.
# SOGO_INIT_SYSTEM_SETTINGS_PATH=/etc/sogo6/system_settings.json
# SOGO_INIT_DOMAIN_SETTINGS_PATH=/etc/sogo6/domain_settings.json

# --- Web ---
# The public URL (scheme, host and port) behind the reverse proxy
# SOGO_P_PUBLIC_BASE_URL=https://mail.example.org
# The Swagger UI of the APIs (/swagger-basic, /swagger-admin), loaded from cdn.jsdelivr.net
DO_SWAGGER=false

# --- gunicorn ---
GUNICORN_BIND=127.0.0.1:5000
# GUNICORN_WORKERS=4
# GUNICORN_LOGLEVEL=warning

# --- Agent ---
# The state of the scheduler (sogo6-agent-beat.service), in its state directory
SOGO_P_AGENT_BEAT_SCHEDULE_PATH=/var/lib/sogo6/celerybeat-schedule
# SOGO_P_AGENT_WORKER_CONCURRENCY=4
