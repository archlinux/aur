# grml-autoconfig options: "debs" installs /debs/*.deb (arch-install-scripts:
# arch-chroot, genfstab) with dpkg, "scripts" then runs /scripts/grml.sh.
# Both are read from the boot medium, i.e. from the ESP.
#
# Deliberately no "toram" variant. live-boot copies the *whole* medium, not just
# the squashfs, and grml runs without swap (NOSWAP in autoconfig.functions), so
# the copy stays pinned in RAM for the whole session - on this ESP well over a
# gigabyte, most of it the host's own kernels and initramfs, which grml never
# opens. Measurably slower both while booting and afterwards, because the only
# thing the kernel can still reclaim is the decompressed squashfs page cache.
# To release this disk, boot grml from a USB stick instead.
title    Grml Live Linux
sort-key grml
linux    /grml/vmlinuz
initrd   /grml/initrd.img
options  apm=power-off boot=live live-media-path=/grml/ nomce net.ifnames=0 lang=us debs scripts
