image: manjarolinux/base:latest

variables:
  GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"

before_script:
  - rm -rf /var/cache/pacman/pkg/* || true
  - sed -i 's/^#\?SigLevel.*/SigLevel = Never/' /etc/pacman.conf || echo -e "\n[options]\nSigLevel = Never\n" >> /etc/pacman.conf
  - pacman -Syu --noconfirm sed jq binutils gtk3 libxss nss dbus-glib git openssh curl python python-pip alsa-lib libxkbcommon
  - useradd -m builduser
  - passwd -d builduser
  - printf 'builduser ALL=(ALL) ALL\n' | tee -a /etc/sudoers
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - mkdir -p /opt/playwright-browsers
  - chmod 755 /opt/playwright-browsers

stages:
  - find_release
  - test
  - release
  - commit

find_release_job:
  stage: find_release
  script:
    - rm -f build.env > /dev/null 2>&1 # clean build.env
    - python3 -m venv .venv
    - .venv/bin/pip install playwright
    - export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
    - .venv/bin/playwright install chromium
    - chmod -R 755 /opt/playwright-browsers
    - export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
    - su -c "cd ${CI_PROJECT_DIR} && export PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers && ./find_release.sh" - builduser
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - PKGBUILD
      - .SRCINFO
      - build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'

test_job:
  stage: test
  script:
    - if [ -z "$pkgver" ]; then echo "version variable does not exist, skipping job"; exit 0; fi
    - sed -i "s/^pkgver=.*/pkgver=${pkgver}/" PKGBUILD
    - su -c "cd ${CI_PROJECT_DIR} && ./test" - builduser
  dependencies:
    - find_release_job
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - PKGBUILD
      - .SRCINFO
      - build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'

release_job:
  stage: release
  script:
    - if [ -z "$pkgver" ]; then echo "version variable does not exist, skipping job"; exit 0; fi
    - git config --global user.email "zomundo@gmail.com"
    - git config --global user.name "Mundo"
    - git remote add aur ssh://aur@aur.archlinux.org/twos-appimage.git
    - git fetch aur master
    - git stash
    - git checkout master
    - git stash pop
    - git add PKGBUILD .SRCINFO
    - git commit -m "temp commit for rebase"
    - git rebase aur/master
    - pk_name=$(grep -Po "^pkgname=\K.*" PKGBUILD)
    - pk_ver=$(grep -Po "^pkgver=\K.*" PKGBUILD)
    - pk_rel=$(grep -Po "^pkgrel=\K.*" PKGBUILD)
    - commit_msg="update to $pk_name ver $pk_ver, rel version $pk_rel"
    - git commit --amend -m "$commit_msg"
    - git push aur master

  dependencies:
    - test_job
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - PKGBUILD
      - .SRCINFO
      - build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'

commit_job:
  stage: commit
  script:
    - if [ -z "$pkgver" ]; then echo "version variable does not exist, skipping job"; exit 0; fi
    - git config --global user.email "zomundo@gmail.com"
    - git config --global user.name "Mundo"
    - git remote add glab "${CI_REPOSITORY_URL}"
    - git fetch glab
    - git checkout -b main
    - pk_name=$(grep -Po "^pkgname=\K.*" PKGBUILD)
    - pk_ver=$(grep -Po "^pkgver=\K.*" PKGBUILD)
    - pk_rel=$(grep -Po "^pkgrel=\K.*" PKGBUILD)
    - commit_msg="update to $pk_name ver $pk_ver, rel version $pk_rel"
    - git add PKGBUILD .SRCINFO
    - git commit -m "$commit_msg"
    - git push glab main
  dependencies:
    - release_job
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - PKGBUILD
      - .SRCINFO
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'
