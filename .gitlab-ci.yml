image: archlinux:latest

before_script:
  - pacman -Sy --noconfirm git base-devel openssh curl grep
  - eval $(ssh-agent -s)
  - echo "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
  - git config --global user.name "GitLab CI Bot"
  - git config --global user.email "bot@gitlab.com"

update_aur:
  script:
    - git clone ssh://aur@aur.archlinux.org/google-chrome-canary-bin.git aur_repo
    - cp PKGBUILD aur_repo/
    - cd aur_repo
    - NEW_VER=$(bash -c 'source ./PKGBUILD; pkgver')
    - if [ -z "$NEW_VER" ]; then echo "No se pudo obtener version"; exit 1; fi
    - sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
    - makepkg --printsrcinfo > .SRCINFO
    - git add PKGBUILD .SRCINFO
    - git commit -m "Automated update to ${NEW_VER}" || exit 0
    - git push origin master
  only:
    - schedules
    - web
