include:
  - project: "common/gitlab-helper"
    ref: master
    file: "ci-helper.yml"

workflow: !reference [ .common, workflow ]

variables:
  PKG_NAME: "helmify-bin"

stages:
  - build
  - test
  - deploy

build-helmify-bin:
  extends: .arch-build
  image: ${CI_REGISTRY}/common/gitlab-helper/archlinux-yay:master
  needs: []
  
test-helmify-bin:
  extends: .arch-test
  image: ${CI_REGISTRY}/common/gitlab-helper/archlinux-yay:master
  needs: ["build-helmify-bin"]

deploy-helmify-bin:
  extends: .arch-deploy
