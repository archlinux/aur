stages:
  - build
  - release

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1
  PACKAGE_IMAGE: registry.gitlab.com/crystalnetwork-studio/dev-tooling/docker/archlinux-builder
  ARTIFACTS_DIR: "artifacts"
  CCACHE_DIR: "/home/builder/.ccache"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  TRANSFER_METER_FREQUENCY: "5s"

.package_job_template: &package_job_template
  image:
    name: $PACKAGE_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p $ARTIFACTS_DIR
  cache:
    key: ccache-$CI_COMMIT_REF_SLUG
    paths:
      - .ccache/
    policy: pull-push
    untracked: false
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - $ARTIFACTS_DIR/

build_package:
  <<: *package_job_template
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - BUILD_DIR="/home/builder/build"
    - mkdir -p "$BUILD_DIR" "$CCACHE_DIR"
    - cp -r . "$BUILD_DIR/"
    - chown -R 1000:1000 "$BUILD_DIR" "$CCACHE_DIR"
    - ln -sf "$CI_PROJECT_DIR/.ccache" "$CCACHE_DIR"
    - sudo pacman -Syy --noconfirm > /dev/null 2>&1 || true
    - |
      sudo -u builder -H --preserve-env=CI_COMMIT_TAG,CI_JOB_ID bash -c "
        set -e
        cd /home/builder/build
        pkgbuild-builder build
      "
    - mv "$BUILD_DIR/$ARTIFACTS_DIR"/* "$CI_PROJECT_DIR/$ARTIFACTS_DIR/"
    - source "$ARTIFACTS_DIR/version.env"
    - echo "Build complete - $PACKAGE_NAME v$FULL_VERSION"
  artifacts:
    paths:
      - $ARTIFACTS_DIR/
    expire_in: 1 week
    reports:
      dotenv: $ARTIFACTS_DIR/version.env

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_package
      artifacts: true
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -e

      echo "Checking for existing release with tag $CI_COMMIT_TAG..."
      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG")

      if [ "$HTTP_STATUS" -eq 200 ]; then
        echo "Existing release found. Deleting..."
        curl --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG"
        echo "Deleted old release."
      fi

      if [[ ! -f "$ARTIFACTS_DIR/version.env" ]]; then
        echo "ERROR: version.env not found!"
        exit 1
      fi

      source "$ARTIFACTS_DIR/version.env"

      if [[ -z "$FULL_VERSION" || -z "$PACKAGE_NAME" || -z "$ARCH" ]]; then
        echo "ERROR: Missing required variables"
        exit 1
      fi

      echo "Creating release: $PACKAGE_NAME v$FULL_VERSION"

      DESCRIPTION="## Package Information

      - **Package Name:** $PACKAGE_NAME
      - **Version:** $FULL_VERSION
      - **Architecture:** $ARCH
      - **Build Date:** $BUILD_DATE
      - **Build Job:** [$BUILD_JOB_ID]($CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID)"

      ASSET_ARGS=""

      for file in "$ARTIFACTS_DIR"/*.pkg.tar.*; do
        if [[ -f "$file" ]]; then
          filename=$(basename "$file")
          ASSET_ARGS="$ASSET_ARGS --assets-link '{\"name\":\"$filename\",\"url\":\"$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/raw/$ARTIFACTS_DIR/$filename\",\"link_type\":\"package\",\"filepath\":\"/$filename\"}'"
        fi
      done

      for file in "$ARTIFACTS_DIR"/{PKGBUILD,*.log}; do
        if [[ -f "$file" ]]; then
          filename=$(basename "$file")
          ASSET_ARGS="$ASSET_ARGS --assets-link '{\"name\":\"$filename\",\"url\":\"$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/raw/$ARTIFACTS_DIR/$filename\",\"link_type\":\"other\",\"filepath\":\"/$filename\"}'"
        fi
      done

      if [[ -z "$ASSET_ARGS" ]]; then
        echo "ERROR: No package files found"
        exit 1
      fi

      eval "release-cli create \
        --name 'Release $TAG_VERSION' \
        --tag-name '$CI_COMMIT_TAG' \
        --description '$DESCRIPTION' \
        $ASSET_ARGS" > /dev/null

      echo "Cleaning up old releases (keeping top 2)..."
      curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases?per_page=100&sort=desc" \
        | jq -r '.[2:] | .[].tag_name' \
        | while read -r tag_to_delete; do
            if [ -n "$tag_to_delete" ]; then
              echo "Deleting old release: $tag_to_delete"
              curl --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$tag_to_delete"
            fi
          done
