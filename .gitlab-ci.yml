image: archlinux:latest

stages:
  - check
  - build
  - update_aur

check_version:
  stage: check
  script:
    - pacman -Sy --noconfirm curl python3
    - LATEST=$(curl -s "https://archlinux.org/packages/extra/x86_64/kwin/json/" | python3 -c "import sys,json; print(json.load(sys.stdin)['pkgver'])")
    - CURRENT=$(grep "pkgver=" PKGBUILD | cut -d= -f2)
    - echo "Latest=$LATEST Current=$CURRENT"
    - if [ "$LATEST" = "$CURRENT" ]; then echo "No update needed"; exit 0; fi
    - echo "NEW_VERSION=$LATEST" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env
    when: always

build:
  stage: build
  needs:
    - job: check_version
      artifacts: true
  script:
    - test -f build.env && source build.env || exit 0
    - test -n "$NEW_VERSION" || exit 0
    - pacman -Syu --noconfirm base-devel
    - useradd -m builder
    - echo "builder ALL=(ALL:ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
    - chmod 440 /etc/sudoers.d/builder
    - sed -i "s/pkgver=.*/pkgver=$NEW_VERSION/" PKGBUILD
    - NEWSHA=$(curl -sL "https://download.kde.org/stable/plasma/$NEW_VERSION/kwin-$NEW_VERSION.tar.xz" | sha256sum | cut -d' ' -f1)
    - sed -i "s/'[a-f0-9]\{64\}'/'$NEWSHA'/" PKGBUILD
    - cp -r . /home/builder/kwin-osd-bottom
    - chown -R builder /home/builder/kwin-osd-bottom
    - cd /home/builder/kwin-osd-bottom
    - sudo -u builder makepkg -s --noconfirm --skippgpcheck
    - 'curl -H "Content-Type:application/json" -d "{\"content\":\"✅ kwin-osd-bottom $NEW_VERSION compilato! Scarica da GitLab.\"}" $DISCORD_WEBHOOK'
  artifacts:
    paths:
      - "*.pkg.tar.zst"
    expire_in: 7 days

update_aur:
  stage: update_aur
  needs:
    - job: check_version
      artifacts: true
    - job: build
  script:
    - test -f build.env && source build.env || exit 0
    - test -n "$NEW_VERSION" || exit 0
    - pacman -Sy --noconfirm git openssh
    - mkdir -p ~/.ssh
    - echo "$AUR_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
    - git config --global user.name "Vittorino_4213"
    - git config --global user.email "greselin2010@gmail.com"
    - git clone ssh://aur@aur.archlinux.org/kwin-osd-bottom.git /tmp/aur
    - cp PKGBUILD /tmp/aur/
    - cd /tmp/aur
    - makepkg --printsrcinfo > .SRCINFO
    - git add PKGBUILD .SRCINFO
    - git commit -m "update to $NEW_VERSION"
    - git push
