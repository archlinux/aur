include:
  - project: "crystalnetwork-studio/dev-tooling/templates/archlinux-builder"
    ref: master
    file:
      - "/build.yml"
      - "/release.yml"

stages:
  - build
  - release

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1
  PACKAGE_IMAGE: registry.gitlab.com/crystalnetwork-studio/dev-tooling/docker/archlinux-builder
  ARTIFACTS_DIR: "artifacts"
  CCACHE_DIR: "/home/builder/.ccache"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  TRANSFER_METER_FREQUENCY: "5s"
