image: archlinux:latest

before_script:
  - pacman -Sy --noconfirm git base-devel openssh curl grep
  - useradd -m builduser
  - echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
  - eval $(ssh-agent -s)
  - echo "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p /home/builduser/.ssh
  - chmod 700 /home/builduser/.ssh
  - ssh-keyscan aur.archlinux.org >> /home/builduser/.ssh/known_hosts
  - chown -R builduser:builduser /home/builduser/.ssh

update_aur:
  script:
    - chown -R builduser:builduser .
    - sudo -u builduser git config --global user.name "GitLab CI Bot"
    - sudo -u builduser git config --global user.email "bot@gitlab.com"
    - sudo -u builduser git clone ssh://aur@aur.archlinux.org/google-chrome-canary-bin.git aur_repo_temp
    - cp PKGBUILD aur_repo_temp/
    - cd aur_repo_temp
    - chown -R builduser:builduser .
    - |
      sudo -u builduser bash -c '
        source ./PKGBUILD
        NEW_VER=$(pkgver)
        if [ -z "$NEW_VER" ]; then
          echo "No se pudo obtener version"
          exit 1
        fi
        sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
        makepkg --printsrcinfo > .SRCINFO
        git add PKGBUILD .SRCINFO
        git commit -m "Automated update to ${NEW_VER}" || true
        git push origin master
      '
  only:
    - schedules
    - web
