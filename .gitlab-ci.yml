image: archlinux:latest

update_aur:
  script: |
    set -x
    pacman -Sy --noconfirm git base-devel openssh curl grep jq
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh
    ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
    echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519
    eval $(ssh-agent -s)
    ssh-add ~/.ssh/id_ed25519
    git config --global user.name "GitLab CI Bot"
    git config --global user.email "bot@gitlab.com"
    git config --global --add safe.directory '*'
    
    # 1. Clonar con reintentos (Si la red falla, intenta 5 veces)
    for i in {1..5}; do
      git clone ssh://aur@aur.archlinux.org/$(basename $(pwd)).git aur_repo_temp && break
      echo "Clone failed, retrying in 15 seconds..."
      rm -rf aur_repo_temp
      sleep 15
    done
    [ -d aur_repo_temp ] || { echo "Failed to clone after 5 retries"; exit 1; }
    
    cp PKGBUILD aur_repo_temp/
    cd aur_repo_temp
    useradd -m builduser
    echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
    chown -R builduser:builduser .
    
    NEW_VER=$(sudo -u builduser bash -c 'source ./PKGBUILD; pkgver')
    
    echo "LA VERSION ENCONTRADA ES: ${NEW_VER}"
    if [ -z "$NEW_VER" ]; then echo "ERROR: No se obtuvo version"; exit 1; fi
    
    sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
    sudo -u builduser makepkg --printsrcinfo > .SRCINFO
    git add PKGBUILD .SRCINFO
    
    git commit -m "Update to ${NEW_VER}" || exit 0
    
    # 2. Hacer Push con reintentos (Si el AUR bloquea, intenta 5 veces)
    for i in {1..5}; do
      git push origin master && exit 0
      echo "Push failed, pulling and retrying in 15 seconds..."
      git pull --rebase origin master || git pull origin master --no-edit -X ours
      sleep 15
    done
    echo "Push failed after 5 retries"
    exit 1
  only:
    - schedules
    - web
