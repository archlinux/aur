stages:
  - build
  - publish
  - release

build:
  stage: build
  image: registry.stefanwimmer128.eu/stefanwimmer128/archlinux-chaotic-paru-user:latest
  before_script:
    - paru -Syu --noconfirm
  script:
    - makepkg -s --noconfirm
  artifacts:
    paths:
      - '*.pkg.tar.zst'

publish:
  stage: publish
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add curl
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "shellspec-${CI_COMMIT_TAG#v}-any.pkg.tar.zst" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/shellspec/${CI_COMMIT_TAG#v}/shellspec-${CI_COMMIT_TAG#v}-any.pkg.tar.zst"'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - 'release-cli create --tag-name "$CI_COMMIT_TAG" --name "shellspec $CI_COMMIT_TAG" --description "shellspec $CI_COMMIT_TAG" --assets-link "{\"name\":\"shellspec-${CI_COMMIT_TAG#v}-any.pkg.tar.zst\",\"filepath\":\"/shellspec-${CI_COMMIT_TAG#v}-any.pkg.tar.zst\",\"url\":\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/shellspec/${CI_COMMIT_TAG##v}/shellspec-${CI_COMMIT_TAG#v}-any.pkg.tar.zst\",\"link_type\":\"package\"}"'
