stages:
  - build
  - publish
  - release

build:
  stage: build
  tags:
    - large
  image: registry.gitlab.com/stefanwimmer128/archlinux-chaotic-paru-user:latest
  before_script:
    - paru -Syu --noconfirm
  script:
    - makepkg -s --noconfirm
  artifacts:
    paths:
      - '*.pkg.tar.zst'

publish:
  stage: publish
  tags:
    - small
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add curl
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "wasi-compiler-rt17-${CI_COMMIT_TAG#v}-x86_64.pkg.tar.zst" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/wasi-compiler-rt17/${CI_COMMIT_TAG#v}/wasi-compiler-rt17-${CI_COMMIT_TAG#v}-x86_64.pkg.tar.zst"'

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - small
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - 'release-cli create --tag-name "$CI_COMMIT_TAG" --name "wasi-compiler-rt17 $CI_COMMIT_TAG" --description "wasi-compiler-rt17 $CI_COMMIT_TAG" --assets-link "{\"name\":\"wasi-compiler-rt17-${CI_COMMIT_TAG#v}-x86_64.pkg.tar.zst\",\"filepath\":\"/wasi-compiler-rt17-${CI_COMMIT_TAG#v}-x86_64.pkg.tar.zst\",\"url\":\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/wasi-compiler-rt17/${CI_COMMIT_TAG##v}/wasi-compiler-rt17-${CI_COMMIT_TAG#v}-x86_64.pkg.tar.zst\",\"link_type\":\"package\"}"'
