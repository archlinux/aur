# Example location for an EXISTING HTTPS virtual host. Set the actual server_name
# and TLS settings in your own site configuration; this is not a complete vhost.
#
# server {
#     listen 443 ssl;
#     server_name chat.example.org;
#     ... your TLS certificate directives ...
#
#     root /usr/share/webapps/stoat-web/current;
#     index index.html;
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
# Root points to the rendered, configured files, NOT the template in dist/.
# Do not cache JS indefinitely: Stoat's placeholder values are injected after
# the Vite build, so config edits can change JS without changing file names.
