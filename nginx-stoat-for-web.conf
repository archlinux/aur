# Example inside an existing HTTPS server { } block.
# Configure server_name and TLS in your own nginx vhost.
# The root MUST point to current/, not the unconfigured dist/ template.
root /usr/share/webapps/stoat-web/current;
index index.html;

# HTML and the service worker should always be revalidated.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}
location = /serviceWorker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# Never return index.html for missing JS, CSS, images, or fonts.
# Runtime-injected JS may retain the same filename after a config change.
location ~* \.(js|mjs|css|json|wasm|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
