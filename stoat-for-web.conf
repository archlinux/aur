# Browser-visible endpoints for a self-hosted Stoat instance.
# Use simple KEY=VALUE syntax (not shell syntax; do not add quotes).
# VITE_HOST is the instance host without https://, e.g. chat.example.org.
# VITE_API_URL is the publicly accessible API URL for browser clients.
# On initial installation, fill both fields and run: sudo stoat-for-web-render
VITE_HOST=
VITE_API_URL=

# Optional browser-side overrides; leave empty to use backend-provided URLs.
VITE_DEV_WS_URL=
VITE_DEV_MEDIA_URL=
VITE_DEV_PROXY_URL=
VITE_DEV_GIFBOX_URL=
VITE_RNNOISE_WORKLET_CDN_URL=
