# Bind to loopback for access through an authenticated reverse proxy.
ESPHOME_BUILDER_HOST=127.0.0.1
ESPHOME_BUILDER_PORT=6052

# Configuration and device data must be writable by esphome-builder.
ESPHOME_BUILDER_CONFIG=/var/lib/esphome-device-builder/configs

# Set both credentials if exposing the service directly to a trusted network.
# Prefer HTTPS via a reverse proxy. Do not expose an unauthenticated dashboard.
# ESPHOME_USERNAME=admin
# ESPHOME_PASSWORD=change-me
