<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kestrel's logo: a male kestrel's head and shoulders in profile. His
       field marks: the blue-grey head with paler grey cheeks, the large dark
       eye in a narrow yellow ring under a heavy brow, the yellow cere and
       short hooked blue-grey bill with a dark tip, the grey moustache stripe,
       the pinkish-buff spotted breast and the chestnut back. The source for
       the app's PWA icons; docs/src/assets/logo.svg is the same bird on an
       inset tile -->
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2b2f36"/>
  <g clip-path="url(#tile)">
    <!-- The bust, in the cheek and throat's pale grey -->
    <path fill="#cfd2d6" d="M6 64 C8 57 10 51 12.5 45 C12 38 13 33 16 30.5 C20.5 20.5 28.5 14.5 37.5 14.5 C43.5 14.5 47.5 16.5 49.5 20 L50 26.5 C49 31.5 46 35.5 42.5 38.5 C44 45 47.5 53 52 64 Z"/>
    <!-- The blue-grey crown, nape and back of the head -->
    <path fill="#97a2ae" d="M6 64 C8 57 10 51 12.5 45 C12 38 13 33 16 30.5 C20.5 20.5 28.5 14.5 37.5 14.5 C43.5 14.5 47.5 16.5 49.5 20 L46 20.6 C42 18.8 36.5 18.8 33 20.8 C30 22.6 29.8 27 31.4 31 C32.8 34.6 32.6 38.2 29.6 41.2 C25 45.5 20 49 16 56 C14.2 59 12.8 61.5 11.8 64 Z"/>
    <!-- The chestnut back at the shoulder, with black spots -->
    <path fill="#b8693a" d="M6 64 C7.4 59.4 8.8 55.6 10.6 51.8 C12.6 55.6 13.4 59.6 12.6 64 Z"/>
    <circle cx="9.6" cy="58.2" r="0.9" fill="#24282e"/>
    <circle cx="11.2" cy="61.8" r="0.8" fill="#24282e"/>
    <!-- The pinkish-buff breast with dark spots -->
    <path fill="#dcb99a" d="M11.8 64 C14.4 57 20.4 51.6 28.4 49.2 C35 47.2 41.4 46.6 45.4 47.4 C47.6 52.6 49.6 58 52 64 Z"/>
    <g fill="#8c6a55">
      <path d="M24 55 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
      <path d="M30.5 52.2 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
      <path d="M37 51 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
      <path d="M42.6 51.4 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
      <path d="M33.6 57.8 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
      <path d="M40.4 58.2 c0.6 1.1 0.5 2.4 -0.4 3.5 c-0.6 -1.1 -0.5 -2.4 0.4 -3.5 Z"/>
    </g>
    <!-- The heavy brow over the eye -->
    <path fill="#6b7684" d="M33 20.8 C36.5 18.8 42 18.8 46 20.6 C43 20.9 37.5 21.6 34.2 23 Z"/>
    <!-- The grey moustache stripe -->
    <path fill="#5d6672" d="M38.4 28.6 C40.6 32 40.6 37.5 38.2 42.5 C36 38.5 36.2 32.5 37 28.9 Z"/>
    <!-- The eye: dark, in a narrow yellow ring, with a glint -->
    <circle cx="40.5" cy="25" r="4.6" fill="#1b1d21" stroke="#f2b31d" stroke-width="1.3"/>
    <circle cx="42" cy="23.6" r="1.1" fill="#ffffff"/>
    <!-- The short hooked bill, blue-grey with a dark tip -->
    <path fill="#7f8c9b" d="M48.5 21.5 C53.5 20.2 57.8 23.6 57.3 29.6 C57.1 31 56.7 32.4 56.1 33.6 C55.7 31.6 54.5 30.4 52.9 30.2 L48.2 30.4 Z"/>
    <path fill="#24282e" d="M55.9 27.2 C57.5 28.8 57.3 31.4 56.1 33.6 C55.7 32 54.9 31 53.9 30.6 Z"/>
    <!-- The yellow cere, with its round nostril -->
    <path fill="#f2b31d" d="M46.6 19.8 C49 18.8 51.8 19.4 52.8 21.6 L52.4 26.2 L47.4 26.6 Z"/>
    <circle cx="50.2" cy="22.4" r="0.95" fill="#24282e"/>
  </g>
</svg>
