# Falco: PTRACE scope. Cross-uid PTRACE is disabled. PTRACE
# rules in the falco ruleset assume a non-zero scope, and
# disabling cross-uid PTRACE closes a class of ptracer-gdb
# privilege-escalation paths.
kernel.yama.ptrace_scope = 1

# Falco: keep the audit backlog large enough to never drop
# syscall events that the kmod can't see (e.g. in namespaces
# the kmod is not loaded into). This is the audit-trail fallback
# for some of the more obscure stable rules.
kernel.audit_backlog_limit = 16384
