# The settings of the SOGo 6 web interface, KEY=value per line, loaded by sogo6-ui.service as its
# environment (EnvironmentFile=). The browser gets them from GET /env, without authentication: no
# secrets here. All settings: /usr/share/doc/sogo6-ui/README.md

# The user API of the SOGo 6 server, as the browser reaches it: relative behind the same reverse
# proxy (/api/ to the server, the rest to this interface), or absolute
REACT_APP_API_BASE_URL=/api/user/v1

# The host names of the admin panel, comma-separated (default admin.localhost)
# NEXT_PUBLIC_ADMIN_DOMAINS=admin.mail.example.org

# Server-sent events for new mail
SSE_ENABLED=true

# Where the interface listens, for the reverse proxy
HOSTNAME=127.0.0.1
PORT=3000
