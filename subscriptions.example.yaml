version: 1

settings:
  mihomo_binary: /usr/bin/mihomo
  home_dir: /etc/mihomo
  config_file: /etc/mihomo/config.yaml
  provider_name: subscriptions
  provider_file: providers/subscriptions.yaml
  provider_group: mihomo
  service_name: mihomo.service
  cache_dir: /var/lib/mihomo-subscription/cache
  timeout_seconds: 30
  max_download_bytes: 8388608

sources:
  # add 仅保存；select ID [ID ...] 启用所选组合，其余设为 false。
  # use ID 仍独占启用单个档案；普通 update 和定时更新处理所有 enabled 来源。
  - id: main
    enabled: false
    url_env: MIHOMO_SUB_MAIN
    prefix: "[main] "
    user_agent: "mihomo"
    headers: {}
    converter:
      type: direct
      # 优先使用上述客户端标识；仅当响应为 URI/Base64 时自动尝试兼容标识。
      # 不修改 URL、不转换原始协议；最终必须取得 Clash/Mihomo YAML。
