# /etc/conf.d/tigervnc-runit
# Shared settings for /etc/runit/sv/tigervnc and /etc/runit/sv/tigervnc-share
# Set to the existing non-root account that owns the VNC desktop.
VNC_USER=""

# Independent virtual X11 session, TCP 5901 for :1 by default.
VNC_DISPLAY=":1"

# Existing X11 desktop sharing: x0vncserver listens on TCP 5900 by default.
SHARE_DISPLAY=":0"
SHARE_PORT="5900"

# Leave blank for $HOME/.Xauthority. Set an absolute path if your display
# manager/startx setup stores the current Xorg authority cookie elsewhere.
SHARE_XAUTHORITY=""

# Leave blank for $HOME/.config/tigervnc/passwd.
# Use vncpasswd as VNC_USER to create the password file first.
SHARE_PASSWORD_FILE=""
