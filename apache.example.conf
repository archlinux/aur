# Example Apache vhost for Firefly III on Arch Linux.
#
# /chart/*, /login, etc. are Laravel routes, not static files. They must be
# rewritten to public/index.php. Arch Apache ignores .htaccess by default
# (AllowOverride None) and leaves mod_rewrite commented out, which 404s
# those routes while the dashboard HTML at / still loads.
#
# Setup:
#   1. Uncomment in /etc/httpd/conf/httpd.conf:
#        LoadModule rewrite_module modules/mod_rewrite.so
#   2. Include this file, or copy the Directory/FallbackResource block
#      into your existing vhost:
#        Include /usr/share/webapps/firefly-iii/apache.example.conf
#   3. systemctl restart httpd
#
# Adjust ServerName and TLS. DocumentRoot must be the public/ directory.

<VirtualHost *:80>
    ServerName firefly.example
    DocumentRoot "/usr/share/webapps/firefly-iii/public"

    <Directory "/usr/share/webapps/firefly-iii/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
        DirectoryIndex index.php
        # Covers the Arch default of AllowOverride None:
        FallbackResource /index.php
    </Directory>

    ErrorLog "/var/log/httpd/firefly-iii-error.log"
    CustomLog "/var/log/httpd/firefly-iii-access.log" common
</VirtualHost>
