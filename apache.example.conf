# Alternative: Subdirectory installation (e.g., http://example.com/wavelog)
# Comment out VirtualHost configurations above and use this instead
Alias /wavelog /usr/share/webapps/wavelog

<Directory /usr/share/webapps/wavelog>
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    # PHP settings
    php_admin_value open_basedir "/tmp:/usr/share/webapps/wavelog:/var/lib/wavelog:/var/log/wavelog"
    php_admin_value upload_tmp_dir "/tmp"
    php_admin_value session.save_path "/tmp"

    # CodeIgniter URL rewriting
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /wavelog
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </IfModule>
</Directory>

# Restrict access to sensitive directories
<Directory /usr/share/webapps/wavelog/application>
    Require all denied
</Directory>

<Directory /usr/share/webapps/wavelog/system>
    Require all denied
</Directory>

# Allow access to assets
<Directory /usr/share/webapps/wavelog/assets>
    Require all granted
</Directory>
