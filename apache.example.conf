# Apache configuration for Wavelog
# Copy this file to /etc/httpd/conf/extra/ and include it in httpd.conf
# Or create a site-specific configuration
#
# IMPORTANT NOTES:
# 1. Enable mod_rewrite: Ensure mod_rewrite is enabled in httpd.conf
# 2. HTTPS strongly recommended: Required for 'KEEP LOGIN' 30-day feature
# 3. For pretty URLs: Set $config['index_page'] = '' in /var/lib/wavelog/config/config.php

# HTTP configuration (Port 80)
# Recommended: Redirect to HTTPS for security
<VirtualHost *:80>
    ServerName wavelog.example.com
    
    # Redirect all HTTP to HTTPS
    Redirect permanent / https://wavelog.example.com/
</VirtualHost>

