# Configuration for matterjs-server.
# All Matter Server CLI options can also be supplied as environment variables.

PORT=5580
LOG_LEVEL=info
STORAGE_PATH=/var/lib/matterjs-server

# Recommended backend for an unprivileged system service.
NOBLE_BINDINGS=dbus

# Uncomment and adjust when needed:
# PRIMARY_INTERFACE=enp1s0
# BLUETOOTH_ADAPTER=0
# DEFAULT_FABRIC_LABEL=Home
# ENABLE_TIME_SYNC=true
# DISABLE_THREAD_DIAGNOSTICS=false
