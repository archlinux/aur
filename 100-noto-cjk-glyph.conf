<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Sans -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Serif -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Serif CJK</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Monospace -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Sans Mono CJK</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>
