# 设备身份与自报 IP(改后 sudo systemctl restart leigod)
#
# 插件二进制写死了只从名为 wlan0 的接口读取设备身份与 IP(SteamDeck 伪装的
# 固有限制)。本包在宿主机没有 wlan0 时创建 dummy wlan0, 按下面两项补身份与 IP。
# 两项都只对 dummy 类型的 wlan0 生效: 宿主机自带真实 wlan0 时整段跳过,
# 物理网卡永远不会被改动。
#
# DEVICE_MAC —— 设备身份(SN), 也就是 dummy wlan0 的 MAC。云侧按 SN+账号维系
# 绑定关系, 所以这项一经启用就不应再变: 改了等于换了一台设备, 手机会要求重新
# 绑定。
#   auto                由 /etc/machine-id 派生(默认; 与物理网卡的数量、命名、
#                       是否开了 MAC 随机化都无关)
#   xx:xx:xx:xx:xx:xx   手工固定(需要沿用一个已有身份时用, 例如把旧机器的
#                       绑定迁移过来; 也可用于回到某个历史 SN)
#
# DEVICE_IP —— 设备自报 IP。getDeviceList 需要设备从 wlan0 取自身 IP, 把自己
# 列为"可加速主机"; dummy 无 IP 会导致设备列表恒为空, App 侧无法选择游戏加速。
#   auto      取默认路由的源地址(适合绝大多数单出口机器)
#   x.x.x.x   手工指定(多网卡/策略路由/VPN 等特殊网络环境用)
#   none      完全不配置 IP
#
# 双网卡(有线+无线)场景: 加速数据路径始终跟随主机路由表(默认路由在有线就走
# 有线), 与设备身份用哪块网卡无关。
DEVICE_MAC=auto
DEVICE_IP=auto
