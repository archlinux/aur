# DEVICE_IP —— 设备自报 IP(改后 sudo systemctl restart leigod)
#
# 插件二进制写死了只从名为 wlan0 的接口读取设备身份与 IP(SteamDeck 伪装的
# 固有限制)。本包在宿主机没有 wlan0 时创建 dummy wlan0 并按此项补 IP:
#   auto      取默认路由的源地址(适合绝大多数单出口机器)
#   x.x.x.x   手工指定(多网卡/策略路由/VPN 等特殊网络环境用)
#   none      完全不配置 IP
#
# 边界说明:
# - 本项只对 dummy 类型的 wlan0 生效, 宿主机自带真实 wlan0 时整段跳过,
#   物理网卡永远不会被改动;
# - 双网卡(有线+无线)场景: 加速数据路径始终跟随主机路由表(默认路由在
#   有线就走有线), 与设备身份用哪个网卡无关; 此时设备身份取真实 wlan0
#   的 MAC, 若该网卡开启 MAC 随机化会导致身份漂移, 需在该连接上固定 MAC。
DEVICE_IP=auto
