<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed by ttf-roboto-flex-hinted (variable build). NOT enabled by
     default. Enable with:

       sudo ln -s /usr/share/fontconfig/conf.avail/79-roboto-flex-families.conf \
                  /etc/fonts/conf.d/

     Family names that select axis settings of the one Roboto Flex variable
     font, so any program that takes a font name (gsettings, GTK CSS,
     pango markup, terminal/editor configs) can use a width or grade:

       "Roboto Flex Condensed Bold 11"  ==  "Roboto Flex Bold 11 @wdth=75"

     Each rule renames the request to "Roboto Flex" and appends the axis
     values as fontvariations, which pango applies on top of its own wght and
     opsz. Weight, italic (81-roboto-flex-italic.conf runs after this file)
     and size combine as usual. They do not appear in font pickers, which
     only list real faces.

     Width is deliberately restrained at text sizes. The designers limit wdth
     through avar by optical size; measured with HarfBuzz on a Latin+Greek
     line, wdth=25 gives 89% of the normal width at opsz 11 (11 pt) but 39% at
     opsz 144. Expect a subtle change in UI text and the full effect in
     headings.

     Only pango (GTK, GNOME Shell, most Linux desktop apps) reads
     fontvariations from fontconfig. Firefox and Chromium ignore it; use CSS
     font-stretch / font-variation-settings there. -->
<fontconfig>
  <!-- ── Widths (wdth, names as in the font's STAT table) ─────────────── -->
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex SuperCondensed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=25</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex UltraCondensed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=50</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex ExtraCondensed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=62.5</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex Condensed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=75</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex SemiCondensed</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=87.5</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex SemiExpanded</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=112.5</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex Expanded</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=125</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex ExtraExpanded</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>wdth=151</string></edit>
  </match>

  <!-- ── Grade (GRAD): weight without reflow ──────────────────────────────
       GRAD thickens or thins the strokes but keeps every advance width (the
       measured line width is identical from -200 to 150), so text does not
       reflow. Light text on a dark background looks heavier than the same
       weight dark-on-light; a small negative grade evens that out. -->
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex Dark</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>GRAD=-25</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex Graded</string></test>
    <edit name="family" mode="assign" binding="same"><string>Roboto Flex</string></edit>
    <edit name="fontvariations" mode="append"><string>GRAD=100</string></edit>
  </match>
</fontconfig>
