# Copy to ~/.config/rclone-sync/<remote>.conf, where <remote> is both the rclone
# remote from `rclone config` and the systemd instance name:
#   mkdir -p ~/.config/rclone-sync
#   cp /usr/share/doc/rclone-sync-timer/example.conf ~/.config/rclone-sync/gdrive-docs.conf
#   $EDITOR ~/.config/rclone-sync/gdrive-docs.conf
#   systemctl --user enable --now rclone-sync@gdrive-docs.timer

# rclone remote, "remote:path" syntax.
RCLONE_SRC=gdrive-docs:Documents

# Local directory.
# Absolute paths only: no shell is involved, so ~ and $HOME are not expanded.
# sync and copy create it, bisync needs both sides to exist.
RCLONE_DEST=/home/you/Documents

# sync (default) mirrors the remote and deletes extra files at RCLONE_DEST.
# copy only adds and updates, deleting nothing.
# bisync syncs in both directions, for keeping several machines in step.
RCLONE_MODE=sync

# Optional extra rclone flags, split on whitespace, unset by default.
# RCLONE_FLAGS=--transfers 4 --checkers 8 --bwlimit 10M:off
