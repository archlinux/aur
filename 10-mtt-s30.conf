# Moore Threads MTT S30 Desktop Environment Hints
# Managed by mtgpu-s30-userland

GBM_BACKEND=mtgpu
KWIN_DRM_DEVICES=/dev/dri/card0
KWIN_DISABLE_UDMABUF_IMPORT=1
# Fix red/blue color channel inversion in X11/Xwayland apps (e.g. WPS Office)
XWAYLAND_NO_GLAMOR=1

# Disable Wayland syncobj in Chromium and Electron to prevent buffer lock failure (-22)
ELECTRON_EXTRA_ARGS="--disable-features=WaylandSyncobj"
CHROMIUM_FLAGS="--disable-features=WaylandSyncobj"

