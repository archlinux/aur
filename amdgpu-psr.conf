# eDP PSR wedges the panel after s2idle resume: the screen holds a stale frame
# for 10-35s while the rest of the stack is healthy. The compositor keeps
# submitting (amdgpu_dm atomic_commit_tail begin/finish stay paired at 11-27 per
# second), the kernel keeps completing those flips (drm_vblank_event_delivered
# tracks them one for one), gfx fences advance, the SMU answers in milliseconds
# and the display controller reports no underflow -- only the panel is stuck,
# sitting in PSR_STATE2a (4), the transitional state on the way into PSR that a
# working link crosses in milliseconds.
#
# Affected resumes carry four core_link_write_dpcd failures (DP_DOWNSPREAD_CTRL
# / LANE_COUNT_SET / LINK_BW_SET / LINK_RATE_SET), so the eDP AUX channel is
# down. PSR entry and exit both ride that channel: the state machine can neither
# finish entering nor be told to leave, and the panel self-refreshes its cached
# frame while the source scans out frames nobody sees. This is an amdgpu
# display-stack bug rather than a compositor one, and it is reported on other
# Strix hardware under KDE Plasma and Cinnamon too.
#
# DC_DISABLE_PSR=0x10 turns off PSR1 and PSR-SU together and is the only setting
# that suppresses the stall; the cost is idle panel power. Disabling PSR-SU
# alone (DC_DISABLE_PSR_SU=0x200) is not enough, because PSR1 needs the same
# AUX-borne exit. Neighbouring bits in amd_shared.h: DC_DISABLE_REPLAY=0x400,
# DC_DISABLE_IPS=0x800.
#
# psr_state reads 0 for as long as this is set, which costs
# tools/psr-stall-stat.sh its signal; the freeze-probe "trace:" lines and the
# core_link_write_dpcd failure count are the objective checks that survive.
#
# dcdebugmask is read once when amdgpu probes (sysfs exposes it 0444), so it has
# to be set at module load. The kms hook pulls amdgpu into the initramfs and the
# modconf hook carries this directory along, so a modprobe.d drop-in lands
# early enough and no kernel command line entry is needed.
options amdgpu dcdebugmask=0x10
