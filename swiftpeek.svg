<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5bc0eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81a2be;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bg)" stroke="#373b41" stroke-width="2"/>
  <!-- Eye / preview symbol -->
  <ellipse cx="256" cy="240" rx="140" ry="80" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="240" r="44" fill="url(#accent)"/>
  <!-- Lightning bolt (speed) -->
  <polygon points="300,120 240,260 280,260 220,400 340,230 290,230 340,120" fill="#f0c674" opacity="0.9"/>
  <!-- "SP" text at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="48" fill="#c5c8c6" letter-spacing="8">SWIFTPEEK</text>
</svg>
