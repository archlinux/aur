# Paths (relative to /) packed into /boot/config.tbz by grml-config-update.
# grml-autoconfig unpacks the tarball to / at boot when the boot option
# "config" is set; ownership and permissions are preserved, unlike loose
# files on the FAT ESP. One path per line, "#" starts a comment.
#
# The ESP is plaintext: anything listed here is readable by whoever has the disk.
root/.zshrc
root/bin
