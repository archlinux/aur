version = 1
SPDX-PackageName = "softmaker-office-2026-bin"
SPDX-PackageSupplier = "d10n <david@bitinvert.com>"
SPDX-PackageDownloadLocation = "https://aur.archlinux.org/packages/softmaker-office-2026-bin.git"
SPDX-PackageComment = "AUR packaging only. The SoftMaker Office 2026 payload is downloaded from softmaker.net at build time and is not redistributed here."

# Packaging files written from scratch for the AUR package.
[[annotations]]
path = [
    "PKGBUILD",
    ".SRCINFO",
    ".gitignore",
    ".nvchecker.toml",
    "README.md",
    "REUSE.toml",
    "keys/**",
    "*.install",
    "*.sysusers",
    "*sysusers.conf",
    "*.tmpfiles",
    "*tmpfiles.conf",
    "*.logrotate",
    "*.pam",
    "*.service",
    "*.socket",
    "*.timer",
    "*.hook",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "WorMzy Tykashi <wormzy.tykashi@gmail.com>",
    "d10n <david@bitinvert.com>",
]
SPDX-License-Identifier = "0BSD"

# Desktop entries and the shared MIME database file are SoftMaker's own files,
# taken from office2026.tar.lzma (mime/pml26.dsk, mime/prl26.dsk,
# mime/tml26.dsk, mime/softmaker-office-2026.xml) with packaging edits applied
# on top (Exec/Icon paths, Categories, versioned icon names).
[[annotations]]
path = [
    "planmaker-2026.desktop",
    "presentations-2026.desktop",
    "textmaker-2026.desktop",
    "softmaker-office-2026.xml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "SoftMaker Software GmbH <info@softmaker.com> and its licensors",
    "WorMzy Tykashi <wormzy.tykashi@gmail.com>",
    "d10n <david@bitinvert.com>",
]
SPDX-License-Identifier = "LicenseRef-custom"

# Launcher scripts, as generated by installsmoffice, but with the install
# prefix changed to /usr/share/office2026.
[[annotations]]
path = ["planmaker26", "presentations26", "textmaker26"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "SoftMaker Software GmbH <info@softmaker.com> and its licensors",
]
SPDX-License-Identifier = "LicenseRef-custom"
