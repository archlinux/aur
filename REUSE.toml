version = 1

[[annotations]]
path = [
    ".gitignore",
    ".SRCINFO",
    "config.json",
    "PKGBUILD",
]
SPDX-FileCopyrightText = "Arch Linux contributors"
SPDX-License-Identifier = "0BSD"

# Changes to the agent, from upstream pull requests
[[annotations]]
path = [
    "fix-agent-version.patch",
    "fix-ip-address.patch",
    "fix-os-release.patch",
]
SPDX-FileCopyrightText = "OCS Inventory contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Exports of the "Linux (Debian based)" and "Linux Extended (Debian
# based)" templates of the OCS Inventory server, whose backend is
# GPL-3.0, with pacman commands in two sections
[[annotations]]
path = [
    "linux-arch-extended-template.json",
    "linux-arch-template.json",
]
SPDX-FileCopyrightText = ["OCS Inventory contributors", "Arch Linux contributors"]
SPDX-License-Identifier = "GPL-3.0-only"
