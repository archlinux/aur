[Service]
# 频繁掉线 / 周期崩溃修复
#
# Arch 的系统 libcurl 链接 OpenSSL 3, 而 aTrust 自带 curl + OpenSSL 1.1。
# 守护进程是 Qt 程序, Qt5Network 启动时会经 libproxy 抢先加载系统的
# libcurl.so.4, 于是 libNetwork 里的 curl_* 调用被系统的 curl 以符号插入
# 方式接管; 第一个周期性 HTTPS 请求(~30s 后)进入 SSL 回调时, 系统 curl
# (OpenSSL 3) 创建的 X509_STORE_CTX 被交给自带的 OpenSSL 1.1 处理,
# 结构体布局不一致 -> SIGSEGV。表现为每 35 秒左右崩溃一次, systemd 随即
# 重启服务, 用户侧就是"登录后每隔几分钟掉线一次"。
#
# 与厂商启动器(atrust-launcher.sh)保持一致, 让守护进程优先使用包内自带的
# curl/openssl; 配合 PKGBUILD 里补的 libcurl.so.4 名字, libproxy 也会解析到
# 同一份自带 curl, 进程里不再出现第二套 curl/OpenSSL 组合。
Environment=LD_LIBRARY_PATH=/usr/share/sangfor/aTrust/resources/bin:/usr/share/sangfor/aTrust/resources/lib
