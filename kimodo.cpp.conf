# kimodo.cpp system service configuration.
# This is a Bash fragment sourced by /usr/lib/kimodo.cpp/kimodo-service.

# Listen on localhost by default. Use 0.0.0.0 only if the service is intended
# to be reachable over the network; a reverse proxy/authentication layer is
# recommended for non-local exposure.
KIMODO_ADDR="127.0.0.1:8090"

# The default StateDirectory managed by systemd. If you change this path while
# ProtectSystem=strict is enabled, add the new path to ReadWritePaths with a
# systemd override as well.
KIMODO_DATA_DIR="/var/lib/kimodo"

# Native worker backend: vulkan or cpu.
KIMODO_BACKEND="vulkan"

# Upstream web-demo defaults. Lower TEXT_LAYER_CHUNK or the residency ceiling
# when VRAM is constrained.
KIMODO_TEXT_LAYER_CHUNK="32"
KIMODO_TEXT_RESIDENT_LIMIT_MIB="10000"

# Optional extra kimodo-demo flags. This is a Bash array, so quoted arguments
# and paths containing spaces are preserved correctly.
# Example:
# KIMODO_EXTRA_ARGS=(--comparisons "/srv/kimodo comparisons")
KIMODO_EXTRA_ARGS=()
