# Installed by the comfyui-manager package.
#
# Starts comfyui.service (shipped by the comfyui package) with ComfyUI-Manager
# enabled. systemd requires ExecStart= to be cleared before it can be
# redefined, so the original command line is repeated with --enable-manager
# appended. Keep it in sync with /usr/lib/systemd/system/comfyui.service.
#
# For further local changes use: systemctl edit comfyui

[Service]
ExecStart=
ExecStart=/usr/bin/comfyui --listen 127.0.0.1 --enable-manager
