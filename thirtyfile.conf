# Settings supported by the upstream binary. Restart thirtyfile.service after changes.
THIRTYFILE_ADDR=127.0.0.1:8080
THIRTYFILE_DATA=/var/lib/thirtyfile/data
THIRTYFILE_STORAGE=/var/lib/thirtyfile/storage

# Optional FTP receive folders use an unprivileged port when enabled in the UI.
THIRTYFILE_FTP_ADDR=0.0.0.0:2121
