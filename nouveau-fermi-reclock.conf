# Nouveau Fermi Reclock & 120Hz display configuration
# Optional overclock pstate (700/1400/900): add "config=NvFermiOC=true" to the options line (default off)
# Optional memory reclock (900MHz): add "config=NvFermiMemReclock=true" (experimental, needs reboot)
options nouveau modeset=1 vblank_continuous=1
