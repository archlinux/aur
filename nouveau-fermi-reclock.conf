# Nouveau Fermi Reclock & 120Hz Display Configuration
# Location: /usr/lib/modprobe.d/nouveau-fermi-reclock.conf
#
# Available Options:
#
# 1. modeset=1 (Default: 1)
#    Enables KMS (Kernel Mode Setting) for Nouveau. Required for display output.
#
# 2. vblank_continuous=1 (Default: 1)
#    Ensures continuous VBlank interrupts for native 120Hz/high-refresh eDP panels,
#    preventing DRI swap intervals from throttling to 60 FPS.
#
# 3. config=NvFermiMemReclock=true (Default: true)
#    Enables bidirectional DDR3 memory reclocking (324 MHz <-> 900 MHz)
#    via the custom resident Falcon executor engine.
#
# 4. config=NvFermiOC=true (Default: false)
#    Enables an optional synthetic overclock performance state:
#    P-State 10: Core 700 MHz | Shader 1400 MHz | Memory 900 MHz @ 1.030 V.
#
# Note: Multiple config options can be combined separated by commas:
#   options nouveau modeset=1 vblank_continuous=1 config=NvFermiMemReclock=true,NvFermiOC=false

options nouveau modeset=1 vblank_continuous=1 config=NvFermiMemReclock=true
