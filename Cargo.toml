[package]
name = "ayaan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AyaanScript+ runtime and ASPKG package manager (Arch-native)"
authors = ["Ayaan"]
repository = "https://github.com/ayaan511/AyaanScript+"
keywords = ["script", "language", "arch", "ayaan"]
categories = ["command-line-utilities"]

# =========================
# BINARIES (ROOT FILES)
# =========================

[[bin]]
name = "ayaan"
path = "ayaan.rs"

[[bin]]
name = "aspkg"
path = "aspkg.rs"

# =========================
# DEPENDENCIES
# =========================

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
