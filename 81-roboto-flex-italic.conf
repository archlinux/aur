<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed by ttf-roboto-flex-hinted (variable build). Enabled by default
     through /usr/share/fontconfig/conf.default.

     Roboto Flex has no italic file: italic is the slnt axis at -10. fontconfig
     matches the "Italic" named instance correctly, but pango then applies its
     own variations to a variable font (wght from the weight, opsz from the
     size), which resets every other axis to its default. slnt goes back to 0
     and "Roboto Flex Italic" renders upright, pixel-identical to Regular.

     This rule adds slnt=-10 to the request whenever Roboto Flex is the first
     family and italic or oblique is asked for. pango merges fontconfig's
     fontvariations with its own, so the slant survives. It has to be a
     target="pattern" rule: pango reads fontvariations from the request
     pattern, an edit on target="font" is ignored (verified with pango 1.58).

     qual="first": only when Roboto Flex was asked for by name (or through
     79-roboto-flex-families.conf), never when it is merely a fallback in a
     sans-serif list, where slnt=-10 would leak to another variable font. -->
<fontconfig>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex</string></test>
    <test name="slant" compare="more_eq"><const>italic</const></test>
    <edit name="fontvariations" mode="append"><string>slnt=-10</string></edit>
  </match>
  <!-- pango may match the variable face itself (slant roman, since slnt
       defaults to 0) rather than the Italic named instance. 90-synthetic.conf
       would then add a fake 0.2 shear matrix on top of the real slnt=-10:
       a double slant, measured 19.6 degrees instead of 10. Mark the match
       as italic first (this file sorts before 90), so the synthetic rule
       skips it. -->
  <match target="font">
    <test qual="first" name="family" compare="eq"><string>Roboto Flex</string></test>
    <test target="pattern" qual="first" name="family" compare="eq"><string>Roboto Flex</string></test>
    <test target="pattern" name="slant" compare="more_eq"><const>italic</const></test>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
</fontconfig>
