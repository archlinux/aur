mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

unified-delay: true
tcp-concurrent: true

external-controller: 127.0.0.1:9090
secret: "__MIHOMO_SECRET__"

external-ui: /usr/share/metacubexd

profile:
  store-selected: true
  store-fake-ip: true

# Use explicit upstream resolvers so TUN takeover on systemd-resolved cannot
# send Mihomo DNS queries back to itself through `system`.
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com

proxy-providers:
  subscriptions:
    type: file
    path: ./providers/subscriptions.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT
    use:
      - subscriptions

  - name: AUTO
    type: url-test
    use:
      - subscriptions
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    empty-fallback: DIRECT

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,PROXY

# TUN is intentionally disabled by default. Verify mixed-port proxying first,
# then enable and tune this block manually if full routing is required.
#
# tun:
#   enable: true
#   stack: mixed
#   auto-route: true
#   auto-detect-interface: true
#   dns-hijack:
#     - any:53
