[Service]
# Arch's docker package sets LimitNOFILE=1048576 in the main unit.
# Bump to infinity for a Yocto-heavy workstation where dockerd
# juggles many containers plus high fd/inode pressure during long
# builds. Container-level nofile is independently set via
# /etc/docker/daemon.json default-ulimits (admin-managed).
LimitNOFILE=infinity

# No ceiling on tasks (threads + processes) spawned by dockerd.
# Parallel bitbake across multiple containers easily breaches the
# systemd default (15% of kernel.pid_max).
TasksMax=infinity
