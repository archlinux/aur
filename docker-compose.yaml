version: '3.8'

x-audiomuse-common-env: &audiomuse-common-env
  TZ: "${TZ:-UTC}"

  # Media server
  MEDIASERVER_TYPE: "jellyfin"
  JELLYFIN_USER_ID: "${JELLYFIN_USER_ID}"
  JELLYFIN_TOKEN: "${JELLYFIN_TOKEN}"
  JELLYFIN_URL: "${JELLYFIN_URL}"

  # AI provider
  AI_MODEL_PROVIDER: "${AI_MODEL_PROVIDER:-OLLAMA}"
  AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-300}"

  OLLAMA_MODEL_NAME: "${OLLAMA_MODEL_NAME:-gemma4:e4b}"
  OLLAMA_SERVER_URL: "${OLLAMA_SERVER_URL:-http://host.docker.internal:11434/api/generate}"

  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_SERVER_URL: "${OPENAI_SERVER_URL:-}"
  OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-}"
  OPENAI_API_CALL_DELAY_SECONDS: "${OPENAI_API_CALL_DELAY_SECONDS:-7}"

  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL_NAME: "${GEMINI_MODEL_NAME:-gemini-2.5-pro}"

  MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
  MISTRAL_MODEL_NAME: "${MISTRAL_MODEL_NAME:-ministral-3b-latest}"

  # Authentication
  AUTH_ENABLED: "${AUTH_ENABLED:-true}"
  API_TOKEN: "${API_TOKEN:-}"
  AUDIOMUSE_USER: "${AUDIOMUSE_USER:-}"
  AUDIOMUSE_PASSWORD: "${AUDIOMUSE_PASSWORD:-}"
  JWT_SECRET: "${JWT_SECRET:-}"

  # Internal AI chat DB
  AI_CHAT_DB_USER_PASSWORD: "${AI_CHAT_DB_USER_PASSWORD:-}"

  # CLAP text search
  CLAP_ENABLED: "${CLAP_ENABLED:-true}"
  CLAP_PYTHON_MULTITHREADS: "${CLAP_PYTHON_MULTITHREADS:-true}"
  CLAP_TEXT_SEARCH_WARMUP_DURATION: "${CLAP_TEXT_SEARCH_WARMUP_DURATION:-300}"
  CLAP_TOP_QUERIES_COUNT: "${CLAP_TOP_QUERIES_COUNT:-1000}"

  # GPU clustering
  USE_GPU_CLUSTERING: "${USE_GPU_CLUSTERING:-false}"

  # Analysis
  NUM_RECENT_ALBUMS: "${NUM_RECENT_ALBUMS:-0}"
  TOP_N_MOODS: "${TOP_N_MOODS:-7}"

  # Clustering
  CLUSTER_ALGORITHM: "${CLUSTER_ALGORITHM:-kmeans}"
  ENABLE_CLUSTERING_EMBEDDINGS: "${ENABLE_CLUSTERING_EMBEDDINGS:-true}"
  CLUSTERING_RUNS: "${CLUSTERING_RUNS:-10000}"
  TOP_N_PLAYLISTS: "${TOP_N_PLAYLISTS:-48}"
  MAX_DISTANCE: "${MAX_DISTANCE:-0.5}"
  MAX_SONGS_PER_CLUSTER: "${MAX_SONGS_PER_CLUSTER:-0}"
  MAX_SONGS_PER_ARTIST: "${MAX_SONGS_PER_ARTIST:-3}"
  MAX_SONGS_PER_ARTIST_PLAYLIST: "${MAX_SONGS_PER_ARTIST_PLAYLIST:-5}"
  MIN_PLAYLIST_SIZE_FOR_TOP_N: "${MIN_PLAYLIST_SIZE_FOR_TOP_N:-20}"

  # K-Means
  NUM_CLUSTERS_MIN: "${NUM_CLUSTERS_MIN:-120}"
  NUM_CLUSTERS_MAX: "${NUM_CLUSTERS_MAX:-280}"

  # PCA
  PCA_COMPONENTS_MIN: "${PCA_COMPONENTS_MIN:-24}"
  PCA_COMPONENTS_MAX: "${PCA_COMPONENTS_MAX:-128}"

  # DBSCAN
  DBSCAN_EPS_MIN: "${DBSCAN_EPS_MIN:-0.1}"
  DBSCAN_EPS_MAX: "${DBSCAN_EPS_MAX:-0.5}"
  DBSCAN_MIN_SAMPLES_MIN: "${DBSCAN_MIN_SAMPLES_MIN:-5}"
  DBSCAN_MIN_SAMPLES_MAX: "${DBSCAN_MIN_SAMPLES_MAX:-20}"

  # GMM
  GMM_N_COMPONENTS_MIN: "${GMM_N_COMPONENTS_MIN:-40}"
  GMM_N_COMPONENTS_MAX: "${GMM_N_COMPONENTS_MAX:-100}"
  GMM_COVARIANCE_TYPE: "${GMM_COVARIANCE_TYPE:-full}"

  # Spectral clustering
  SPECTRAL_N_CLUSTERS_MIN: "${SPECTRAL_N_CLUSTERS_MIN:-40}"
  SPECTRAL_N_CLUSTERS_MAX: "${SPECTRAL_N_CLUSTERS_MAX:-100}"
  SPECTRAL_N_NEIGHBORS: "${SPECTRAL_N_NEIGHBORS:-20}"

  # Stratified sampling
  MIN_SONGS_PER_GENRE_FOR_STRATIFICATION: "${MIN_SONGS_PER_GENRE_FOR_STRATIFICATION:-100}"
  STRATIFIED_SAMPLING_TARGET_PERCENTILE: "${STRATIFIED_SAMPLING_TARGET_PERCENTILE:-50}"
  SAMPLING_PERCENTAGE_CHANGE_PER_RUN: "${SAMPLING_PERCENTAGE_CHANGE_PER_RUN:-0.2}"

  # Clustering score weights
  SCORE_WEIGHT_DIVERSITY: "${SCORE_WEIGHT_DIVERSITY:-2.0}"
  SCORE_WEIGHT_PURITY: "${SCORE_WEIGHT_PURITY:-2.0}"
  SCORE_WEIGHT_OTHER_FEATURE_DIVERSITY: "${SCORE_WEIGHT_OTHER_FEATURE_DIVERSITY:-0.5}"
  SCORE_WEIGHT_OTHER_FEATURE_PURITY: "${SCORE_WEIGHT_OTHER_FEATURE_PURITY:-0.5}"
  SCORE_WEIGHT_SILHOUETTE: "${SCORE_WEIGHT_SILHOUETTE:-0.5}"
  SCORE_WEIGHT_DAVIES_BOULDIN: "${SCORE_WEIGHT_DAVIES_BOULDIN:-0.25}"
  SCORE_WEIGHT_CALINSKI_HARABASZ: "${SCORE_WEIGHT_CALINSKI_HARABASZ:-0.25}"

  # Purity calculation
  TOP_K_MOODS_FOR_PURITY_CALCULATION: "${TOP_K_MOODS_FOR_PURITY_CALCULATION:-3}"

  # Batch clustering behavior
  CLUSTERING_BATCH_CHECK_INTERVAL_SECONDS: "${CLUSTERING_BATCH_CHECK_INTERVAL_SECONDS:-30}"
  CLUSTERING_BATCH_TIMEOUT_MINUTES: "${CLUSTERING_BATCH_TIMEOUT_MINUTES:-60}"
  CLUSTERING_MAX_FAILED_BATCHES: "${CLUSTERING_MAX_FAILED_BATCHES:-10}"
  ITERATIONS_PER_BATCH_JOB: "${ITERATIONS_PER_BATCH_JOB:-20}"
  MAX_CONCURRENT_BATCH_JOBS: "${MAX_CONCURRENT_BATCH_JOBS:-10}"
  MAX_QUEUED_ANALYSIS_JOBS: "${MAX_QUEUED_ANALYSIS_JOBS:-25}"

  # Genetic / optimization behavior
  TOP_N_ELITES: "${TOP_N_ELITES:-10}"
  EXPLOITATION_PROBABILITY_CONFIG: "${EXPLOITATION_PROBABILITY_CONFIG:-0.7}"
  EXPLOITATION_START_FRACTION: "${EXPLOITATION_START_FRACTION:-0.2}"
  MUTATION_FLOAT_ABS_DELTA: "${MUTATION_FLOAT_ABS_DELTA:-0.05}"
  MUTATION_INT_ABS_DELTA: "${MUTATION_INT_ABS_DELTA:-3}"
  MUTATION_KMEANS_COORD_FRACTION: "${MUTATION_KMEANS_COORD_FRACTION:-0.05}"

  # DB fetch and duplicate checks
  DB_FETCH_CHUNK_SIZE: "${DB_FETCH_CHUNK_SIZE:-1000}"
  DUPLICATE_DISTANCE_CHECK_LOOKBACK: "${DUPLICATE_DISTANCE_CHECK_LOOKBACK:-1}"
  DUPLICATE_DISTANCE_THRESHOLD_COSINE: "${DUPLICATE_DISTANCE_THRESHOLD_COSINE:-0.01}"
  DUPLICATE_DISTANCE_THRESHOLD_EUCLIDEAN: "${DUPLICATE_DISTANCE_THRESHOLD_EUCLIDEAN:-0.15}"

  # Lyrics
  LYRICS_ENABLED: "${LYRICS_ENABLED:-true}"
  LYRICS_API_ENABLE: "${LYRICS_API_ENABLE:-true}"
  LYRICS_ASR_ENABLE: "${LYRICS_ASR_ENABLE:-true}"
  LYRICS_ASR_BEAM_SIZE: "${LYRICS_ASR_BEAM_SIZE:-5}"
  LYRICS_ASR_MIN_AVG_LOGPROB: "${LYRICS_ASR_MIN_AVG_LOGPROB:--1.0}"
  LYRICS_ASR_NON_ENGLISH_MIN_LOGPROB: "${LYRICS_ASR_NON_ENGLISH_MIN_LOGPROB:--0.85}"
  LYRICS_MIN_CHARS_FOR_EMBEDDING: "${LYRICS_MIN_CHARS_FOR_EMBEDDING:-250}"
  LYRICS_TRANSLATOR_CHUNK_CHARS: "${LYRICS_TRANSLATOR_CHUNK_CHARS:-200}"
  MUSICSERVER_LYRICS_TIMEOUT: "${MUSICSERVER_LYRICS_TIMEOUT:-2.5}"

  # Mood similarity
  MOOD_SIMILARITY_ENABLE: "${MOOD_SIMILARITY_ENABLE:-false}"
  MOOD_SIMILARITY_THRESHOLD: "${MOOD_SIMILARITY_THRESHOLD:-0.15}"

  # AI prompt limits
  MAX_SONGS_IN_AI_PROMPT: "${MAX_SONGS_IN_AI_PROMPT:-25}"
  PER_SONG_MODEL_RELOAD: "${PER_SONG_MODEL_RELOAD:-true}"

  # Playlist behavior
  PLAYLIST_ENERGY_ARC: "${PLAYLIST_ENERGY_ARC:-false}"
  ENERGY_MIN: "${ENERGY_MIN:-0.01}"
  ENERGY_MAX: "${ENERGY_MAX:-0.15}"

  # Song Alchemy
  ALCHEMY_DEFAULT_N_RESULTS: "${ALCHEMY_DEFAULT_N_RESULTS:-100}"
  ALCHEMY_MAX_N_RESULTS: "${ALCHEMY_MAX_N_RESULTS:-200}"
  ALCHEMY_SUBTRACT_DISTANCE_ANGULAR: "${ALCHEMY_SUBTRACT_DISTANCE_ANGULAR:-0.2}"
  ALCHEMY_SUBTRACT_DISTANCE_EUCLIDEAN: "${ALCHEMY_SUBTRACT_DISTANCE_EUCLIDEAN:-5.0}"
  ALCHEMY_TEMPERATURE: "${ALCHEMY_TEMPERATURE:-1.0}"

  # Artist index
  ARTIST_INDEX_MAX_PART_SIZE_MB: "${ARTIST_INDEX_MAX_PART_SIZE_MB:-50}"

  # Audio loading
  AUDIO_LOAD_TIMEOUT: "${AUDIO_LOAD_TIMEOUT:-600}"

  # Cleaning
  CLEANING_SAFETY_LIMIT: "${CLEANING_SAFETY_LIMIT:-100}"

  # Provider migration
  MIGRATION_UNMATCHED_ALBUMS_PAYLOAD_LIMIT: "${MIGRATION_UNMATCHED_ALBUMS_PAYLOAD_LIMIT:-200}"

  # Song path
  PATH_AVG_JUMP_SAMPLE_SIZE: "${PATH_AVG_JUMP_SAMPLE_SIZE:-200}"
  PATH_CANDIDATES_PER_STEP: "${PATH_CANDIDATES_PER_STEP:-25}"
  PATH_DEFAULT_LENGTH: "${PATH_DEFAULT_LENGTH:-25}"
  PATH_DISTANCE_METRIC: "${PATH_DISTANCE_METRIC:-angular}"
  PATH_FIX_SIZE: "${PATH_FIX_SIZE:-false}"
  PATH_LCORE_MULTIPLIER: "${PATH_LCORE_MULTIPLIER:-3}"

  # Semantic grove
  SEM_GROVE_WEIGHT_AUDIO: "${SEM_GROVE_WEIGHT_AUDIO:-0.25}"
  SEM_GROVE_WEIGHT_LYRICS: "${SEM_GROVE_WEIGHT_LYRICS:-0.75}"

  # Similarity defaults
  SIMILARITY_ELIMINATE_DUPLICATES_DEFAULT: "${SIMILARITY_ELIMINATE_DUPLICATES_DEFAULT:-true}"
  SIMILARITY_RADIUS_DEFAULT: "${SIMILARITY_RADIUS_DEFAULT:-true}"

  # Sonic fingerprint
  SONIC_FINGERPRINT_CRON_PLAYLIST_NAME: "${SONIC_FINGERPRINT_CRON_PLAYLIST_NAME:-Sonic Fingerprint by AudioMuse-AI}"
  SONIC_FINGERPRINT_NEIGHBORS: "${SONIC_FINGERPRINT_NEIGHBORS:-100}"
  SONIC_FINGERPRINT_TOP_N_SONGS: "${SONIC_FINGERPRINT_TOP_N_SONGS:-20}"

  # VAD
  VAD_VOICE_RECOGNITION: "${VAD_VOICE_RECOGNITION:-25}"

  # Voyager index
  VOYAGER_EF_CONSTRUCTION: "${VOYAGER_EF_CONSTRUCTION:-1024}"
  VOYAGER_M: "${VOYAGER_M:-64}"
  VOYAGER_MAX_PART_SIZE_MB: "${VOYAGER_MAX_PART_SIZE_MB:-50}"
  VOYAGER_METRIC: "${VOYAGER_METRIC:-angular}"
  VOYAGER_QUERY_EF: "${VOYAGER_QUERY_EF:-1024}"

  # Proxy
  ENABLE_PROXY_FIX: "${ENABLE_PROXY_FIX:-false}"

  # Rebuild index
  REBUILD_INDEX_BATCH_SIZE: "${REBUILD_INDEX_BATCH_SIZE:-1000}"

services:
  # AudioMuse-AI Flask application service
  audiomuse-ai-flask:
    image: ghcr.io/neptunehub/audiomuse-ai:latest # Reflects deployment.yaml
    container_name: audiomuse-ai-flask-app
    extra_hosts:
      - "host.docker.internal=host-gateway"
    ports:
      - "${FRONTEND_PORT:-8000}:8000" # Map host port 8000 to container port 8000
    environment:
      <<: *audiomuse-common-env
      SERVICE_TYPE: "flask" # Tells the container to run the Flask app
      # DATABASE_URL is now constructed by config.py from the following:
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "/run/postgresql" # Socket path of the postgres host db
      POSTGRES_PORT: "5432" # Host PostgreSQL socket port
      TEMP_DIR: "/app/temp_audio"
    volumes:
      - temp-audio-flask:/app/temp_audio # Volume for temporary audio files
      - /run/postgresql:/run/postgresql:ro
    restart: unless-stopped

  # AudioMuse-AI RQ Worker service
  audiomuse-ai-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:latest # Reflects deployment.yaml
    container_name: audiomuse-ai-worker-instance
    stop_grace_period: 10m
    extra_hosts:
      - "host.docker.internal=host-gateway"
    environment:
      <<: *audiomuse-common-env
      SERVICE_TYPE: "worker" # Tells the container to run the RQ worker
      # DATABASE_URL is now constructed by config.py from the following:
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "/run/postgresql" # Socket path of the postgres host db
      POSTGRES_PORT: "5432" # Host PostgreSQL socket port
      TEMP_DIR: "/app/temp_audio"
    volumes:
      - temp-audio-worker:/app/temp_audio # Volume for temporary audio files
      - /run/postgresql:/run/postgresql:ro
    restart: unless-stopped

# Define volumes for persistent data and temporary files
volumes:
#  postgres-data:
  temp-audio-flask: # Volume for Flask app's temporary audio
  temp-audio-worker: # Volume for Worker's temporary audio
