# leigod 加速器 bwrap 沙箱参数 —— 由 /usr/lib/leigod/run.sh 逐行读取后传给 bwrap
# 设计: 文件系统/进程视图伪装成 SteamDeck, 网络与主机共享(不隔离)
# 语法: 每行一个或多个由空白分隔的参数; '#' 开头为注释; 顺序敏感(先挂载后覆盖/创建)
#
# --- 只读系统视图(插件要 exec ip / iptables / curl, 依赖这些路径) ---
--ro-bind /usr /usr
--ro-bind /bin /bin
--ro-bind /sbin /sbin
--ro-bind /lib /lib
--ro-bind /lib64 /lib64
#
# --- /etc: overlay(下层=主机 /etc 只读, 上层=沙箱内 tmpfs 可写, 退出即弃) ---
#     resolv.conf 等由下层直接可见; 可写上层让 bwrap 能创建 /etc/version
--overlay-src /etc
--tmp-overlay /etc
--perms 0444
--ro-bind-data 10 /etc/version
#
# --- SteamOS 伪造: Arch 的 /etc/os-release 是指向 /usr/lib/os-release 的符号链接, ---
#     bwrap 拒绝绑定挂载到符号链接目标上, 故改为覆盖 /usr/lib/os-release
#     (符号链接解析时会落到我们的假文件)
--ro-bind /opt/leigod/fake_os_release /usr/lib/os-release
#
# --- 设备与进程视图 ---
# 用 --dev-bind 直接共享宿主 /dev。不要改回 --dev /dev + 单独 bind /dev/net/tun:
# bwrap 以 root 运行时, --dev 新建 tmpfs 的设备白名单会拒绝 open 该节点
# (即使节点存在且 root 也 EACCES), 导致加速器 `ip tuntap add` 建 tun 失败。
--dev-bind /dev /dev
--proc /proc
--ro-bind /sys /sys
--ro-bind /opt/leigod/fake_product_name /sys/class/dmi/id/product_name
#
# --- 可写运行区 ---
--bind /run /run
--dir /var
--symlink /run /var/run
--bind /tmp /tmp
#
# --- SteamDeck 目录伪装: 官方守护脚本按 /home/deck 判定安装目录 ---
--dir /home/deck
--bind /opt/leigod /home/deck/leigod
#
# --- 网络: 与主机共享(默认值, 显式声明以明确本方案不隔离网络) ---
--share-net
#
# --- 沙箱主进程随 bwrap 退出被 SIGKILL; 其余残留由 systemd KillMode=control-group 兜底 ---
--die-with-parent
