# SimpleX XFTP server configuration
# Documentation: https://simplex.chat/docs/xftp-server.html

[TRANSPORT]
# Your server domain or IP address
host: your.domain.com
port: 5244
log_tls_errors: off

[AUTH]
# Set new_files to off to stop accepting uploads (e.g. when decommissioning)
new_files: on

# Uncomment to require password for uploading files.
# Share password only with trusted users — it is NOT sent to file recipients.
# Format in client: xftp://fingerprint:password@host
# create_password: your-secure-password

[STORE_LOG]
# Persist file chunks index across restarts
enable: on

# Log daily transfer statistics (CSV at /var/opt/simplex-xftp/file-server-stats.daily.log)
log_stats: on

[TRANSPORT_CONFIG]
# Maximum file storage quota
quota: 20gb

# Path to store uploaded file chunks
path: /srv/xftp
