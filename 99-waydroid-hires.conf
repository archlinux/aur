# Installed by waydroid-apple-music.
#
# PipeWire defaults to a single fixed rate and resamples everything to it, which
# would silently downsample Apple Music's 44.1kHz and hi-res content on its way
# to the DAC. Listing the rates lets PipeWire switch the device to match the
# source instead, so playback stays bit-perfect.
#
# 44100 as the default: most music is 44.1kHz, so it is the least disruptive
# resting rate. Anything in allowed-rates can still be switched to on demand.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
}
