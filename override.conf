# Example drop-in for comfykick.service
#
# The ComfyKick service unit sandboxes the home directory,
# so files under ~ are not visible / writable. To still use a directory under
# your home (e.g. models, output, external ComfyUI trees), expose it
# to the service without disabling the sandbox:
#
#   systemctl --user edit comfykick.service
#   (paste the [Service] block below, then save)
#   systemctl --user daemon-reload
#   systemctl --user restart comfykick.service
#
# Replace %h/dir/ with the absolute path you need; %h expands to your home
# directory. Add one BindPaths= line per directory you want to expose.

[Service]
BindPaths=%h/foo/
BindPaths=%h/bar/

# If `github_token` is not configured in comfykick.toml,
# ComfyKick will attempt to retrieve it from environment variables.
# Of course, the sandbox needs to pass it in manually.
Environment=GITHUB_TOKEN=xxx
