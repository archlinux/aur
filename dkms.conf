PACKAGE_NAME="hotfix-kvadra-touchpad"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="hotfix-kvadra-touchpad"
DEST_MODULE_LOCATION[0]="/kernel/drivers/input/misc"
AUTOINSTALL="yes"
MAKE[0]="make -C \${kernel_source_dir} M=\${dkms_tree}/\${PACKAGE_NAME}/\${PACKAGE_VERSION}/build modules"
CLEAN="make -C \${kernel_source_dir} M=\${dkms_tree}/\${PACKAGE_NAME}/\${PACKAGE_VERSION}/build clean"
POST_INSTALL="rmmod hotfix-kvadra-touchpad 2>/dev/null; modprobe hotfix-kvadra-touchpad 2>/dev/null || true"
POST_REMOVE="rmmod hotfix-kvadra-touchpad 2>/dev/null || true"
