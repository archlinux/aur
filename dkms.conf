PACKAGE_NAME="daxfs"
PACKAGE_VERSION="@PKGVER@"
# Call kbuild directly: upstream's Makefile treats the KERNELRELEASE= that DKMS
# passes as "inside kbuild" and exposes no targets
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/daxfs modules"
BUILT_MODULE_NAME[0]="daxfs"
BUILT_MODULE_LOCATION[0]="daxfs/"
DEST_MODULE_LOCATION[0]="/kernel/fs/daxfs"
# Only useful on multikernel hosts; does not build on newer kernel APIs (e.g. 7.3)
BUILD_EXCLUSIVE_KERNEL="-multikernel$"
AUTOINSTALL="yes"
