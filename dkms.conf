PACKAGE_NAME="hid-logitech-k400plus"
PACKAGE_VERSION="@PKGVER@"

PRE_BUILD="prepare-kernel-source.sh"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/hid modules"

BUILT_MODULE_NAME[0]="hid-logitech-hidpp"
BUILT_MODULE_LOCATION[0]="drivers/hid"

# DKMS decides the actual updates/dkms installation path.
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"

AUTOINSTALL="yes"
