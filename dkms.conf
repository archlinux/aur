PACKAGE_NAME="@_PKGNAME"
PACKAGE_VERSION="@PKGVER@"
AUTOINSTALL="yes"
BDIR="$dkms_tree/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
MAKEARGS=" -C $kernel_source_dir M=${BDIR}/extensions XA_ABSTOPSRCDIR=${BDIR} XA_TOPSRCDIR=${BDIR} V=1"
MAKE="make ${MAKEARGS} modules ; find ${BDIR} -name '*.ko' -exec mv -v {} ${BDIR} \;"
#CLEAN="make ${MAKEARGS} clean"
#BUILD_EXCLUSIVE_KERNEL="^4\.(1[5-9]|[2-9][0-9])"

BUILT_MODULE_NAME=("xt_ACCOUNT" "xt_pknock" "xt_CHAOS" "xt_DELUDE" "xt_DHCPMAC" "xt_DNETMAP" "xt_IPMARK" "xt_LOGMARK" "xt_PROTO" "xt_SYSRQ" "xt_TARPIT" "xt_asn" "xt_condition" "xt_fuzzy" "xt_geoip" "xt_iface" "xt_ipp2p" "xt_ipv4options" "xt_length2" "xt_lscan" "xt_psd" "xt_quota2")

set_locations() {
local xt_index
for ((xt_index=0; xt_index < ${#BUILT_MODULE_NAME[@]}; xt_index++)); do
    BUILT_MODULE_LOCATION[${xt_index}]=""
    DEST_MODULE_LOCATION[${xt_index}]="/updates"
done
}
set_locations
