PACKAGE_NAME="mediatek-mt7927"
PACKAGE_VERSION="2.14"

# Auto-detect LLVM/Clang toolchain (e.g. CachyOS) from kernel config
_LLVM="$(grep -qs '^CONFIG_CC_IS_CLANG=y' ${kernel_source_dir}/.config && echo LLVM=1)"
_KDIR="${kernel_source_dir}"
_BUILD="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

# ---------------------------------------------------------------------------
# Bluetooth gating
#
# MT6639 Bluetooth is native from kernel 7.1 on, so from there these modules
# add exactly one thing: device ID 0489:e156 (HP EliteMini), which is not
# upstream. Building them anyway replaces the in-tree btusb and btmtk for every
# Bluetooth device on the system, which is a real cost for users who gain
# nothing. So skip them by default on 7.1+ and let e156 owners opt back in with
#
#     echo 'BUILD_BT=yes' | sudo tee /etc/mediatek-mt7927-dkms.conf
#
# e156 owners genuinely need the modules: the ID has to be in the driver's own
# btmtk_mt6639_devs[] table, which a `new_id` write cannot supply.
#
# The module arrays below are built conditionally rather than declared up front.
# That matters. An earlier version of this gate skipped the Bluetooth build but
# still listed btusb and btmtk in BUILT_MODULE_NAME, so DKMS looked for modules
# that were never produced and the install failed (GH #85). If the modules are
# not built they must not be declared.
# ---------------------------------------------------------------------------
_bt_build=yes

_kv="${kernelver:-$(uname -r)}"
_kmaj="${_kv%%.*}"
_krest="${_kv#*.}"
_kmin="${_krest%%.*}"
_kmin="${_kmin%%[!0-9]*}"

if [ -n "${_kmaj}" ] && [ -n "${_kmin}" ] 2>/dev/null; then
    if [ "${_kmaj}" -gt 7 ] 2>/dev/null; then
        _bt_build=no
    elif [ "${_kmaj}" -eq 7 ] 2>/dev/null && [ "${_kmin}" -ge 1 ] 2>/dev/null; then
        _bt_build=no
    fi
fi

# Opt-in overrides the version gate.
if [ -r /etc/mediatek-mt7927-dkms.conf ]; then
    . /etc/mediatek-mt7927-dkms.conf
fi
case "${BUILD_BT:-}" in
[yY] | [yY][eE][sS] | 1 | [tT][rR][uU][eE]) _bt_build=yes ;;
esac

if [ "${_bt_build}" = yes ]; then
    MAKE[0]="make ${_LLVM} -C ${_KDIR} M=${_BUILD}/drivers/bluetooth modules && make ${_LLVM} -C ${_KDIR} M=${_BUILD}/mt76 modules"
else
    MAKE[0]="make ${_LLVM} -C ${_KDIR} M=${_BUILD}/mt76 modules"
fi

_i=0

if [ "${_bt_build}" = yes ]; then
    # Bluetooth modules
    BUILT_MODULE_NAME[$_i]="btusb"
    BUILT_MODULE_LOCATION[$_i]="drivers/bluetooth"
    DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
    _i=$((_i + 1))

    BUILT_MODULE_NAME[$_i]="btmtk"
    BUILT_MODULE_LOCATION[$_i]="drivers/bluetooth"
    DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
    _i=$((_i + 1))
fi

# WiFi modules
BUILT_MODULE_NAME[$_i]="mt76"
BUILT_MODULE_LOCATION[$_i]="mt76"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt76-connac-lib"
BUILT_MODULE_LOCATION[$_i]="mt76"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt792x-lib"
BUILT_MODULE_LOCATION[$_i]="mt76"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt7921-common"
BUILT_MODULE_LOCATION[$_i]="mt76/mt7921"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt7921e"
BUILT_MODULE_LOCATION[$_i]="mt76/mt7921"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt7925-common"
BUILT_MODULE_LOCATION[$_i]="mt76/mt7925"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"
_i=$((_i + 1))

BUILT_MODULE_NAME[$_i]="mt7925e"
BUILT_MODULE_LOCATION[$_i]="mt76/mt7925"
DEST_MODULE_LOCATION[$_i]="/updates/dkms/"

AUTOINSTALL="yes"
