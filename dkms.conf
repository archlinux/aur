# Installed under /usr/src/aic8800-${PACKAGE_VERSION}/ (see PKGBUILD).
# Keep PACKAGE_VERSION in sync with pkgver when tagging releases, or let PKGBUILD rewrite it.
PACKAGE_NAME="aic8800"
PACKAGE_VERSION="6.4.3.0"
AUTOINSTALL="yes"
REMAKE_INITRD="no"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_PLATFORM_UBUNTU=y LLVM=1 modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/aic_btusb CONFIG_PLATFORM_UBUNTU=y LLVM=1 modules"
CLEAN="make clean; make -C aic_btusb clean"

BUILT_MODULE_NAME[0]="aic8800D80_fdrv"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/aic8800D80"

BUILT_MODULE_NAME[1]="aic_btusb"
BUILT_MODULE_LOCATION[1]="aic_btusb"
DEST_MODULE_LOCATION[1]="/kernel/drivers/bluetooth"
