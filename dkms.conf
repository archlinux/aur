PACKAGE_NAME="@PKGNAME@"
PACKAGE_VERSION="@PKGVER@"

if grep -q '^CONFIG_CC_IS_CLANG=y$' "$kernel_source_dir/include/config/auto.conf" 2>/dev/null; then
    MAKE[0]="make -C driver KERNEL_LOCATION=$kernel_source_dir LLVM=1 CC=clang"
else
    MAKE[0]="make -C driver KERNEL_LOCATION=$kernel_source_dir"
fi

BUILT_MODULE_LOCATION[0]="driver/"
BUILT_MODULE_NAME[0]="pcan"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
