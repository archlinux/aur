PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="@PKGVER@"

BUILT_MODULE_NAME[0]="kernelsu"
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"

MAKE[0]="KVERSION=${kernelver} KBUILD_MODPOST_WARN=1 KSU_GIT_VERSION=@KSU_GIT_VERSION@ KSU_EXPECTED_SIZE=@KSU_EXPECTED_SIZE@ KSU_EXPECTED_HASH=@KSU_EXPECTED_HASH@ make KDIR=${kernel_source_dir}"