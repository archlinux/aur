PACKAGE_NAME="nouveau-fermi-reclock"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="nouveau"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/nouveau"
AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_DRM_NOUVEAU=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
