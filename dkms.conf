PACKAGE_NAME="ec_su_axb35"
PACKAGE_VERSION="@PKGVER@"

# First module (the main EC driver)
MAKE[0]="make KERNEL_BUILD=$kernel_source_dir"
BUILT_MODULE_NAME[0]="ec_su_axb35"
DEST_MODULE_LOCATION[0]="/kernel/drivers/extra"

# Second module (the HWMON sensor driver)
BUILT_MODULE_NAME[1]="ec_su_axb35_hwmon"
BUILT_MODULE_LOCATION[1]="hwmon/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/hwmon"

AUTOINSTALL="yes"
