<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed by ttf-geologica-hinted (variable build). NOT enabled by
     default. Enable with:

       sudo ln -s /usr/share/fontconfig/conf.avail/79-geologica-families.conf \
                  /etc/fonts/conf.d/

     Family names that select axis settings of the one Geologica variable
     font, so any program that takes a font name (gsettings, GTK CSS, pango
     markup, terminal/editor configs) can use them:

       "Geologica Sharp Bold 11"  ==  "Geologica Bold 11 @SHRP=100"
       "Geologica Cursive 11"     ==  "Geologica 11 @CRSV=1"

     Weight, italic and size combine as usual: pango sends its own wght (from
     the weight) and slnt+CRSV=1 (from the italic style) and merges these
     values on top. "Geologica Semi Sharp Bold Italic 11" therefore renders
     SHRP=50, wght=700, slnt=-12, CRSV=1 (verified). They do not appear in
     font pickers, which only list real faces.

     Only pango (GTK, GNOME Shell, most Linux desktop apps) reads
     fontvariations from fontconfig. Firefox and Chromium ignore it; use CSS
     there:

       font-variation-settings: "SHRP" 100;            (sharpness)
       font-variation-settings: "slnt" -12;            (oblique, roman forms)
       font-feature-settings: "ss01";                  (cursive a/g, like CRSV=1)

     The sharpness axis changes terminal treatment and lengthens ascenders and
     descenders by 40/2000 em at SHRP=100; the line width moves by -0.2%. -->
<fontconfig>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Geologica Sharp</string></test>
    <edit name="family" mode="assign" binding="same"><string>Geologica</string></edit>
    <edit name="fontvariations" mode="append"><string>SHRP=100</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Geologica Semi Sharp</string></test>
    <edit name="family" mode="assign" binding="same"><string>Geologica</string></edit>
    <edit name="fontvariations" mode="append"><string>SHRP=50</string></edit>
  </match>
  <!-- Cursive variants of a, g and the accented a forms, upright. The same
       substitution is reachable as the ss01 feature, which is what a browser
       needs (it cannot set an axis value from CSS without
       font-variation-settings). -->
  <match target="pattern">
    <test qual="first" name="family" compare="eq"><string>Geologica Cursive</string></test>
    <edit name="family" mode="assign" binding="same"><string>Geologica</string></edit>
    <edit name="fontvariations" mode="append"><string>CRSV=1</string></edit>
  </match>
</fontconfig>
