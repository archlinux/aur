<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">PSX2EBOOT</title>
  <desc id="description">PSX converted to PSP with a downward arrow</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263a74"/>
      <stop offset="0.52" stop-color="#17244f"/>
      <stop offset="1" stop-color="#0c1533"/>
    </linearGradient>
    <linearGradient id="arrow" x1="64" y1="48" x2="64" y2="81" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feOffset in="blur" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#05091a" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowLayer"/>
      <feMerge>
        <feMergeNode in="shadowLayer"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="118" height="118" rx="27" fill="url(#background)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="#87a6ff" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M20 18h88a13 13 0 0 1 10 5.1A111 111 0 0 0 14 63V31a13 13 0 0 1 6-13Z" fill="#fff" opacity="0.055"/>

  <g fill="#f7f9ff" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="64" y="43" font-size="31" letter-spacing="1">PSX</text>
    <text x="64" y="109" font-size="31" letter-spacing="1">PSP</text>
  </g>

  <path d="M59 49a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v15h7.4a3 3 0 0 1 2.2 5L66.2 82a3 3 0 0 1-4.4 0L49.4 69a3 3 0 0 1 2.2-5H59V49Z" fill="url(#arrow)" filter="url(#shadow)"/>
  <path d="M62 50h4v18h6.8L64 77.2 55.2 68H62V50Z" fill="#fff" opacity="0.18"/>
</svg>
