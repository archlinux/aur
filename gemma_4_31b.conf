# Gemma 4 31B (dense) — BF16, ~62GB VRAM
# Copy to /etc/sglang/ and run: systemctl start sglang@gemma_4_31b
# TP not yet supported for Gemma 4 in sglang — override global SGLANG_OPTS if needed
SGLANG_OPTS="--port 30000 --tp-size 1"
SGLANG_ARGS="--model-path google/gemma-4-31b-it --attention-backend triton --tool-call-parser pythonic --disable-cuda-graph"
