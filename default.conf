# Hermes Agent Hardening - default configuration
#
# These values apply to every instance. Override them per instance in
# /etc/hermes-agent-hardening/instances/NAME.conf
#
# After editing, run:
#   hermes-instance regenerate --all

[AppArmor]
# complain: log policy violations, allow them (default, safe for setup)
# enforce: block policy violations (enable after reviewing the logs)
Mode=complain
# Paths the instance may read, in addition to its own home.
# Repeat the key for multiple paths.
# ExtraRead=/mnt/Media
# Paths the instance may read and write.
# ExtraWrite=/mnt/Writable

[Limits]
CPUWeight=50
MemoryHigh=3G
MemoryMax=4G
TasksMax=1024
# User slice (dashboard/webui) defaults; only override if you need different values
SliceMemoryHigh=6G
SliceMemoryMax=7G

[Network]
# LAN addresses this instance may reach. Loopback and the internet are
# always allowed. Repeat the key for multiple addresses.
# Allow=192.168.1.26
# Allow=192.168.1.27
