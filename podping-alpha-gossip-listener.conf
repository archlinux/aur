# Environment for podping-alpha-gossip-listener.service
#
# This file follows Arch's /etc/conf.d convention and is consumed via
# EnvironmentFile= by the systemd unit.

IROH_NODE_KEY_FILE=/var/lib/podping-alpha-gossip-listener/gossip_listener_node.key
KNOWN_PEERS_FILE=/var/lib/podping-alpha-gossip-listener/gossip_listener_known_peers.txt
TRUSTED_PUBLISHERS_FILE=/var/lib/podping-alpha-gossip-listener/trusted_publishers.txt

# Enable on-disk archival if desired.
ARCHIVE_ENABLED=false
ARCHIVE_PATH=/var/lib/podping-alpha-gossip-listener/listener_archive.db

# Enable SSE only if you intend to expose it.
SSE_ENABLED=false
SSE_BIND_ADDR=127.0.0.1:8089

# Optional overrides.
# BOOTSTRAP_PEER_IDS=
# DHT_INITIAL_SECRET=
# NODE_FRIENDLY_NAME=
# PEER_ANNOUNCE_INTERVAL=300
# PEER_ENDORSE_INTERVAL=45
# SSE_BUFFER_SIZE=1000
