# 5588 端口的 WebSocket 门前过滤(由 sslh 实现, 随 leigod.service 拉起)。
# 只把携带 "Upgrade: websocket" 首部的连接转发给真实 web 进程(127.0.0.1:5589),
# 其余裸 HTTP/端口扫描指向 127.0.0.1:1(无监听)直接关闭, 后端永远看不到它们。
# 修改本文件后: sudo systemctl restart leigod

timeout: 2;

# 压掉 sslh-fork 每个连接退出时 SIGCHLD 打断 accept/waitpid 的例行噪音;
# 后端连接失败等真正有用的错误日志走其他类别, 不受影响
verbose-system-error: 0;

listen:
(
    { host: "0.0.0.0"; port: "5588"; }
);

protocols:
(
    { name: "regex"; host: "127.0.0.1"; port: "5589"; fork: true;
      regex_patterns: [ "(?i)upgrade:\\s*websocket" ]; },

    { name: "timeout"; host: "127.0.0.1"; port: "1"; }
);

on-timeout: "timeout";
