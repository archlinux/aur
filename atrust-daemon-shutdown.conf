[Service]
# 关机/重启卡住修复
# 官方单元 KillMode=process 只向主进程发信号, 而 aTrust 会另外拉起
# 低权限的 core 插件与隧道子进程(aTrustXtunnel-64 等); 它们残留后会占用
# /home /tmp 等挂载点, 导致 systemd-shutdown 长时间等待、无法卸载文件系统。
KillMode=control-group
SendSIGKILL=yes

# aTrustAgent(plugin-daemon) 不响应 SIGTERM, 官方单元只能等 TimeoutStopSec
# 超时后 SIGKILL 收场: 每次 stop 卡 5~8 秒, 并在 systemctl 里留下
# "State 'stop-sigterm' timed out" / "Failed with result 'timeout'"。
# 这里主动收尾: 先 TERM 让 core 有机会退网清理, 2 秒后强制回收整个进程
# 家族, stop 可在 ~2s 内完成; SIGKILL 记为成功退出, 不再报错。
TimeoutStopSec=6
SuccessExitStatus=SIGKILL
ExecStop=/bin/sh -c '/usr/bin/pkill -TERM -x aTrustAgent; /usr/bin/pkill -TERM -x aTrustXtunnel-6; sleep 2; /usr/bin/pkill -KILL -x aTrustAgent; /usr/bin/pkill -KILL -x aTrustXtunnel-6; exit 0'

# 兜底清理: 子进程若已脱离 cgroup(setsid/double-fork), 按进程名精确清理。
# 注意: 这里只清守护进程家族的孤儿, 绝不能杀托盘——ExecStopPost 在每次
# 服务重启时都会执行, 杀托盘会导致用户界面上"过一会自动闪退"。
# pkill -x 只匹配 comm(内核截断 15 字符), aTrustXtunnel-64 的 comm 是 aTrustXtunnel-6。
ExecStopPost=/bin/sh -c '/usr/bin/pkill -x aTrustAgent; /usr/bin/pkill -x aTrustXtunnel-6; exit 0'
