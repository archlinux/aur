<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

    <!-- Notebook -->
    <rect x="120" y="96" width="260" height="320" rx="24" fill="#FFFFFF"/>

    <!-- Rings -->
    <circle cx="120" cy="150" r="8" fill="#64748B"/>
    <circle cx="120" cy="210" r="8" fill="#64748B"/>
    <circle cx="120" cy="270" r="8" fill="#64748B"/>
    <circle cx="120" cy="330" r="8" fill="#64748B"/>

    <!-- Lines -->
    <line x1="170" y1="170" x2="340" y2="170" stroke="#D1D5DB" stroke-width="8"/>
    <line x1="170" y1="220" x2="340" y2="220" stroke="#D1D5DB" stroke-width="8"/>
    <line x1="170" y1="270" x2="340" y2="270" stroke="#D1D5DB" stroke-width="8"/>
    <line x1="170" y1="320" x2="300" y2="320" stroke="#D1D5DB" stroke-width="8"/>

    <!-- Stylized i -->
    <circle cx="255" cy="145" r="14" fill="#2563EB"/>
    <rect x="240" y="170" width="30" height="120" rx="15" fill="#2563EB"/>
</svg>

