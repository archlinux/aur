# Shared by mosaicod.service and mosaico-cleanup.service, installed as
# 10-sandbox.conf in each one's drop-in directory. Drop-ins are applied in
# filename order across directories, so the prefix puts this file before the
# override.conf that `systemctl edit` writes, which can then change any of it.
#
# A store directory outside /var/lib/mosaico has to be added to ReadWritePaths
# in an override of both units.
[Service]
ReadWritePaths=/var/lib/mosaico
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
