#
# Configuration snippet for Free Pascal cross-compilers
# towards Windows (mingw-w64-fpc package).
#
# Usage: add this line to /etc/fpc.cfg or ~/.fpc.cfg
#
#       #INCLUDE /etc/fpc-mingw-w64.cfg
#
# With the 'fpc' package installed, this is usually not necessary: ​​your fpc.cfg
# already contains the generic paths based on $fpctarget. This file
# only adds the mingw-w64 library paths.
#

#IFDEF WIN32
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/i686-w64-mingw32/lib
#ENDIF

#IFDEF WIN64
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/x86_64-w64-mingw32/lib
#ENDIF
