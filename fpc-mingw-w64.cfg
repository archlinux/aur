#
# Fragmento de configuracion para los cross compiladores de Free Pascal
# hacia Windows (paquete mingw-w64-fpc).
#
# Uso: anadir esta linea a /etc/fpc.cfg o a ~/.fpc.cfg
#
#     #INCLUDE /etc/fpc-mingw-w64.cfg
#
# Con el paquete 'fpc' instalado normalmente no hace falta: su fpc.cfg
# ya contiene las rutas genericas basadas en $fpctarget. Este fichero
# solo anade, ademas, las rutas de bibliotecas de mingw-w64.
#

#IFDEF WIN32
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/i686-w64-mingw32/lib
#ENDIF

#IFDEF WIN64
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget
-Fu/usr/lib/fpc/$fpcversion/units/$fpctarget/*
-Fl/usr/x86_64-w64-mingw32/lib
#ENDIF
