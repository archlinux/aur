# Configuration file for nouveau-dynclockd (Nouveau Fermi Dynamic Clock Governor)
# Location: /etc/nouveau-dynclockd.conf
#
# Changes to this file are automatically detected and reloaded within 1 second,
# or immediately via 'systemctl reload nouveau-dynclockd' / 'nouveau-ctrl set_throttle_temp <temp>'.

# Temperature in °C at or above which GPU clocks are capped to P-State 07 (default: 80)
THROTTLE_TEMP=80

# Temperature hysteresis in °C: GPU must cool down to (THROTTLE_TEMP - THROTTLE_HYST)
# before the cap is lifted back to P-State 0f (default: 5)
THROTTLE_HYST=5

# Polling interval in seconds (default: 1.0)
POLL_INTERVAL=1.0

# Activity threshold: aggregate process ticks per second to trigger 2D/WebGL scale-up to 07 (default: 40)
LOAD_TICK_THRESHOLD=40

# Minimum CPU/GPU rendering ticks per second required for an unknown DRM client to be
# classified as an active 3D workload eligible for P-State 0f (default: 20)
CLIENT_3D_TICK_THRESHOLD=20

# Number of consecutive active polls required before upscaling 07 -> 0f for a 3D app,
# preventing transient DRM probes (glxinfo, gst-plugin-scanner, browser init) from
# triggering a DDR3 memory reclock (default: 2)
UPCLOCK_3D_CONFIRM_POLLS=2

# PowerMizer hold-down timer in seconds before stepping down from 0f -> 07 after 3D
# load ceases, preventing 07 <-> 0f thrashing during loading screens or pauses (default: 8)
HOLD_0F_SECONDS=8

# Hold-down timer in seconds before stepping down from 07 -> IDLE_STATE (03) after
# desktop/browser activity settles (default: 5)
HOLD_07_SECONDS=5

# Target idle performance state when no 3D or desktop rendering load is active (default: 03)
IDLE_STATE=03

# Cap maximum performance state to 07 (P8 202/324 MHz) on battery/DC power,
# matching proprietary NVIDIA 390.157 behavior (default: true). Set to false
# to allow full 0f/3D clocks on battery at the cost of runtime.
BATTERY_CAP=true

# Automatically clamp idle floor to P-State 07 when a high-refresh or high-dot-clock
# display (>135 MHz pixel clock, e.g. 1920x1080 @ 120 Hz) is active, matching proprietary
# NVIDIA 390.157 IMP checks (_nv002187kms). Dropping to 03 (50 MHz core) during 120 Hz
# scanout causes display FIFO underflows and screen flicker (default: true).
DISPLAY_120HZ_FLOOR=true

# GPU interrupt rate per second (from /proc/interrupts nvkm) above which active
# rendering load is recognized even if CPU ticks are low (default: 100)
INTERRUPT_THRESHOLD=100

# Allow synthetic P-State 10 (Overclock 700/1400/900 MHz) for known 3D benchmarks and
# games when connected to AC power and within thermal limits (default: false)
ALLOW_OC_10=false

# Directory containing per-application profile drop-ins (*.conf)
PROFILES_DIR=/etc/nouveau-dynclockd.d
