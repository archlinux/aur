# Configuration file for nouveau-dynclockd (Nouveau Fermi Dynamic Clock Governor)
# Location: /etc/nouveau-dynclockd.conf
#
# Changes to this file are automatically detected and reloaded within 1 second,
# or immediately via 'systemctl reload nouveau-dynclockd' / 'nouveau-ctrl set_throttle_temp <temp>'.

# Temperature in °C at or above which GPU clocks are capped to P-State 07 (default: 80)
THROTTLE_TEMP=80

# Temperature hysteresis in °C: GPU must cool down to (THROTTLE_TEMP - THROTTLE_HYST)
# before the cap is lifted back to P-State 0f (default: 5)
THROTTLE_HYST=5

# Polling interval in seconds (default: 1.0)
POLL_INTERVAL=1.0

# Activity threshold: aggregate process ticks per second to trigger 3D scale-up (default: 40)
LOAD_TICK_THRESHOLD=40

# Target idle performance state when no 3D load is active (default: 03)
IDLE_STATE=03
